<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenKit 3D Viewer (OpenGothic Pipeline)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        .viewer-container {
            flex: 1;
            position: relative;
            background: #111;
        }

        #threejs-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .render-info {
            display: none;
        }

        .controls-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
        }

        canvas:focus {
            outline: none;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="viewer-container">
            <canvas id="threejs-canvas"></canvas>
            

            <div class="render-info" id="renderInfo">
                <div>FPS: <span id="fps">0</span></div>
                <div>Triangles: <span id="triangles">0</span></div>
                <div>Draw Calls: <span id="drawCalls">0</span></div>
            </div>

            <div id="status" class="controls-info">
                <div><strong>Loading Status:</strong></div>
                <div>Initializing ZenKit...</div>
            </div>

            <div class="controls-info" style="top: 120px;">
                <div><strong>Camera Controls:</strong></div>
                <div>Mouse: Click & drag to look around</div>
                <div>WASD / Arrows: Move</div>
                <div>Q/Space: Up | Z/Shift: Down</div>
                <div>Mouse wheel: Speed</div>
            </div>

        </div>
    </div>

    <script type="module">
        // Import Three.js from CDN
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.min.js';
        
        let ZenKit = null;
        let scene, camera, renderer;
        let worldMesh = null;
        let stats = { triangles: 0 };
        
        // Asset caches to avoid reloading
        const meshCache = new Map(); // path -> processed mesh data
        const textureCache = new Map(); // path -> THREE.DataTexture
        const materialCache = new Map(); // texture path -> THREE.Material
        const modelCache = new Map(); // path -> ZenKit Model instance
        const morphMeshCache = new Map(); // path -> { morphMesh, processed, animations }
        
        // VOB management
        const loadedVOBs = new Map(); // vob id -> THREE.Mesh
        const allVOBs = []; // All VOB data from world
        let lastCameraPosition = new THREE.Vector3();
        const VOB_LOAD_DISTANCE = 5000; // Load VOBs within this distance
        const VOB_UNLOAD_DISTANCE = 6000; // Unload VOBs beyond this distance

        // Camera control variables
        let moveSpeed = 50;
        let mouseSensitivity = 0.002;
        let pitch = 0, yaw = 0;
        let velocity = new THREE.Vector3();
        let isMouseDown = false;
        let lastMouseX = 0, lastMouseY = 0;

        // Initialize Three.js Scene
        function initThreeJS() {
            const canvas = document.getElementById('threejs-canvas');
            
            // Scene - match reference viewer
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            // Camera with optimized near/far planes to reduce z-fighting
            camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 1.0, 100000);
            camera.position.set(0, 0, 0); // Start at origin for easy exploration
            camera.lookAt(-1, 0, 0); // Look along positive X axis
            
            // Renderer with enhanced depth buffer settings - match reference viewer
            renderer = new THREE.WebGLRenderer({ 
                canvas, 
                antialias: true,
                logarithmicDepthBuffer: true  // Better depth precision for large scenes
            });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace; // Critical for proper color display
            
            // Additional depth buffer settings for better rendering
            renderer.sortObjects = true;  // Ensure proper depth sorting
            renderer.autoClear = true;
            
            // Note: MeshBasicMaterial doesn't use lighting, so lights won't affect appearance
            
            // Simple orbit controls (manual implementation)
            setupControls();
            
            // Handle resize
            window.addEventListener('resize', onWindowResize);
        }
        
        function setupControls() {
            const canvas = renderer.domElement;
            const keys = {};

            // Initialize camera orientation from current position
            const initialDirection = new THREE.Vector3(0, 0, -1);
            initialDirection.applyQuaternion(camera.quaternion);
            yaw = Math.atan2(initialDirection.x, initialDirection.z);
            pitch = Math.asin(initialDirection.y);

            // Mouse controls for camera rotation
            canvas.addEventListener('mousedown', (event) => {
                isMouseDown = true;
                lastMouseX = event.clientX;
                lastMouseY = event.clientY;
                canvas.requestPointerLock();
            });

            document.addEventListener('mousemove', (event) => {
                if (!isMouseDown || document.pointerLockElement !== canvas) return;

                const deltaX = event.movementX || 0;
                const deltaY = event.movementY || 0;

                yaw -= deltaX * mouseSensitivity;
                pitch -= deltaY * mouseSensitivity;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));

                updateCameraOrientation();
            });

            canvas.addEventListener('mouseup', () => {
                isMouseDown = false;
                document.exitPointerLock();
            });

            // Keyboard controls for movement
            document.addEventListener('keydown', (event) => {
                keys[event.code] = true;
            });

            document.addEventListener('keyup', (event) => {
                keys[event.code] = false;
            });

            // Mouse wheel for movement speed
            canvas.addEventListener('wheel', (event) => {
                moveSpeed += event.deltaY * 0.1;
                moveSpeed = Math.max(1, Math.min(500, moveSpeed));
                event.preventDefault();
            });

            function updateCameraOrientation() {
                // Create quaternion from pitch and yaw
                const quaternion = new THREE.Quaternion();
                quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                camera.quaternion.copy(quaternion);
            }

            function updateMovement() {
                velocity.set(0, 0, 0);

                // Movement directions relative to camera
                const forward = new THREE.Vector3(0, 0, -1);
                const right = new THREE.Vector3(1, 0, 0);
                const up = new THREE.Vector3(0, 1, 0);

                forward.applyQuaternion(camera.quaternion);
                right.applyQuaternion(camera.quaternion);

                // WASD or Arrow keys
                if (keys['KeyW'] || keys['ArrowUp']) {
                    velocity.add(forward);
                }
                if (keys['KeyS'] || keys['ArrowDown']) {
                    velocity.sub(forward);
                }
                if (keys['KeyA'] || keys['ArrowLeft']) {
                    velocity.sub(right);
                }
                if (keys['KeyD'] || keys['ArrowRight']) {
                    velocity.add(right);
                }
                if (keys['KeyQ'] || keys['Space']) {
                    velocity.add(up);
                }
                if (keys['KeyZ'] || keys['ShiftLeft']) {
                    velocity.sub(up);
                }

                // Normalize and apply speed
                if (velocity.length() > 0) {
                    velocity.normalize().multiplyScalar(moveSpeed);
                    camera.position.add(velocity);
                }
            }

            // Animation loop for smooth movement
            function animate() {
                updateMovement();
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            animate();
        }

        async function initZenKit() {
            try {
                const ZenKitModule = (await import('../build-wasm/wasm/zenkit.mjs')).default;
                ZenKit = await ZenKitModule();
                updateStatus(`✅ ZenKit ${ZenKit.getZenKitVersion()} initialized successfully!`, 'success');
                
                // Initialize Three.js
                initThreeJS();
                
                // Try to load TOTENINSEL.ZEN automatically (contains our TEST_CHEST)
                tryLoadDefaultFile();
                
            } catch (error) {
                updateStatus(`❌ Failed to initialize ZenKit: ${error.message}`, 'error');
                console.error('ZenKit initialization error:', error);
            }
        }

        function updateStatus(message, type = 'loading') {
            console.log(message);
            const statusEl = document.getElementById('status');
            if (statusEl) {
                statusEl.innerHTML = `<div><strong>Loading Status:</strong></div><div>${message}</div>`;
            }
        }

        async function tryLoadDefaultFile() {
            try {
                updateStatus('🔍 Looking for world file...', 'loading');
                
                const response = await fetch('/public/game-assets/WORLDS/NEWWORLD/NEWWORLD.ZEN');
                if (response.ok) {
                    const arrayBuffer = await response.arrayBuffer();
                    const uint8Array = new Uint8Array(arrayBuffer);
                    await processZenFile(uint8Array, arrayBuffer.byteLength);
                } else {
                    updateStatus('📂 World file not found.', 'loading');
                }
            } catch (error) {
                updateStatus('📂 World file not found.', 'loading');
            }
        }


        async function processZenFile(uint8Array, fileSize) {
            try {
                updateStatus(`📖 Loading world file...`, 'loading');

                // Create world and load
                const world = ZenKit.createWorld();
                const success = world.loadFromArray(uint8Array);

                if (!success || !world.isLoaded) {
                    throw new Error(world.getLastError() || 'Unknown loading error');
                }

                const mesh = world.mesh;

                // Create 3D mesh
                createThreeJSMesh(mesh);

                // Load and render VOBs
                loadVOBs(world);

                updateStatus(`✅ World file loaded successfully!`, 'success');

            } catch (error) {
                updateStatus(`❌ Failed to load world file: ${error.message}`, 'error');
                console.error('File processing error:', error);
            }
        }

        

        async function createThreeJSMesh(zenMesh) {
            // Remove existing mesh
            if (worldMesh) {
                scene.remove(worldMesh);
                worldMesh.geometry.dispose();
                if (Array.isArray(worldMesh.material)) {
                    worldMesh.material.forEach(m => m.dispose());
                } else {
                    worldMesh.material.dispose();
                }
            }
            
            try {
                console.log('🔧 Using new getProcessedMeshData() with OpenGothic pipeline...');
                
                // Get processed mesh data (with material deduplication, composite vertices, sorting)
                const processed = zenMesh.getProcessedMeshData();
                
                // Convert Emscripten vectors to typed arrays
                const vertCount = processed.vertices.size();
                const idxCount = processed.indices.size();
                const matIdCount = processed.materialIds.size();
                const matCount = processed.materials.size();
                
                console.log(`Processed mesh: ${vertCount/8} vertices, ${idxCount/3} triangles, ${matCount} materials (deduplicated)`);
                
                // Build Three.js geometry from processed data
                // Vertices are [x,y,z, nx,ny,nz, u,v] × vertex_count
                const positions = new Float32Array(idxCount * 3); // Expand to non-indexed
                const normals = new Float32Array(idxCount * 3);
                const uvs = new Float32Array(idxCount * 2);
                
                for (let i = 0; i < idxCount; i++) {
                    const vertIdx = processed.indices.get(i);
                    const vertBase = vertIdx * 8;
                    
                    // Position
                    positions[i*3 + 0] = processed.vertices.get(vertBase + 0);
                    positions[i*3 + 1] = processed.vertices.get(vertBase + 1);
                    positions[i*3 + 2] = processed.vertices.get(vertBase + 2);
                    
                    // Normal
                    normals[i*3 + 0] = processed.vertices.get(vertBase + 3);
                    normals[i*3 + 1] = processed.vertices.get(vertBase + 4);
                    normals[i*3 + 2] = processed.vertices.get(vertBase + 5);
                    
                    // UV
                    uvs[i*2 + 0] = processed.vertices.get(vertBase + 6);
                    uvs[i*2 + 1] = processed.vertices.get(vertBase + 7);
                }
                
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
                geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
                
                // Build material groups based on processed material IDs
                // materialIds is per-triangle, so we need to find consecutive runs
                const triCount = matIdCount;
                geometry.clearGroups();
                
                let currentMatId = processed.materialIds.get(0);
                let groupStart = 0;
                
                for (let t = 1; t <= triCount; t++) {
                    const matId = (t < triCount) ? processed.materialIds.get(t) : -1; // Force flush at end
                    
                    if (t === triCount || matId !== currentMatId) {
                        // End of group
                        const vertexStart = groupStart * 3; // 3 vertices per triangle
                        const vertexCount = (t - groupStart) * 3;
                        geometry.addGroup(vertexStart, vertexCount, currentMatId);
                        
                        groupStart = t;
                        currentMatId = matId;
                    }
                }
                
                // Build materials array from deduplicated materials
                const materialArray = [];
                for (let mi = 0; mi < matCount; mi++) {
                    const mat = processed.materials.get(mi);
                    const fallback = new THREE.MeshBasicMaterial({
                        color: 0xFFFFFF,  // WHITE - don't tint the texture!
                        side: THREE.DoubleSide,
                        transparent: false,  // Disable transparency for alpha-tested materials
                        alphaTest: 0.5       // Use proper alpha test threshold like OpenGothic
                    });
                    materialArray.push(fallback);
                    
                    // Load texture asynchronously
                    if (mat && mat.texture && mat.texture.length) {
                        const url = tgaNameToCompiledUrl(mat.texture);
                        loadCompiledTexAsDataTexture(url).then(tex => {
                            if (tex) {
                                materialArray[mi].map = tex;
                                materialArray[mi].needsUpdate = true;
                                renderer.render(scene, camera);
                            }
                        }).catch(() => {
                            console.warn(`Failed to load texture: ${mat.texture}`);
                        });
                    }
                }
                
                worldMesh = new THREE.Mesh(geometry, materialArray);
                
                // Compute bounding box
                geometry.computeBoundingBox();
                
                worldMesh.scale.x = -1; // Fix mirrored world
                
                scene.add(worldMesh);
                
                // Update stats
                stats.triangles = triCount;
                
                console.log('✅ 3D mesh created successfully with processed data!');
                console.log(`   - ${matCount} deduplicated materials`);
                console.log(`   - ${vertCount/8} composite vertices`);
                console.log(`   - ${triCount} triangles (sorted by material)`);
                
                // Render once after creating the mesh
                renderer.render(scene, camera);
                
            } catch (error) {
                console.error('❌ Failed to create 3D mesh:', error);
                console.error('Error stack:', error.stack);
                updateStatus(`❌ Failed to create 3D mesh: ${error.message}`, 'error');
            }
        }

        async function loadVOBs(world) {
            try {
                console.log('🔧 Collecting VOBs...');
                const vobs = world.getVobs();
                const vobCount = vobs.size();
                console.log(`Found ${vobCount} root VOBs`);

                let totalCount = 0;
                const visualTypeCounts = {};

                // Recursive function to collect VOB data
                function collectVobTree(vob, vobId = 0) {
                    totalCount++;
                    
                    // Track visual type statistics
                    const typeKey = `Type_${vob.visual.type}`;
                    visualTypeCounts[typeKey] = (visualTypeCounts[typeKey] || 0) + 1;
                    
                    // Only store VOBs that have visible meshes
                    if (vob.showVisual && vob.visual.name &&
                        (vob.visual.type === 1 || vob.visual.type === 2 || vob.visual.type === 5 || vob.visual.type === 6) &&
                        !vob.visual.name.toUpperCase().endsWith('.TEX') &&
                        !vob.visual.name.toUpperCase().endsWith('.TGA')) {

                        allVOBs.push({
                            id: `${vobId}_${totalCount}`,
                            vob: vob,
                            position: new THREE.Vector3(-vob.position.x, vob.position.y, vob.position.z),
                            visualName: vob.visual.name
                        });
                    }
                    
                    // Process children recursively
                    const childCount = vob.children.size();
                    for (let i = 0; i < childCount; i++) {
                        collectVobTree(vob.children.get(i), vobId);
                    }
                }

                // Collect all VOBs
                for (let i = 0; i < vobCount; i++) {
                    const vob = vobs.get(i);
                    collectVobTree(vob, i);
                }

                console.log(`📊 Total VOBs (including children): ${totalCount}`);
                console.log(`📊 Renderable VOBs: ${allVOBs.length}`);
                
                const typeNames = ['DECAL', 'MESH', 'MULTI_RES_MESH', 'PARTICLE', 'CAMERA', 'MODEL', 'MORPH_MESH', 'UNKNOWN'];
                console.log('📊 Visual type breakdown:');
                Object.keys(visualTypeCounts).sort().forEach(key => {
                    const typeNum = parseInt(key.split('_')[1]);
                    const typeName = typeNames[typeNum] || 'UNKNOWN';
                    console.log(`   ${typeName} (${typeNum}): ${visualTypeCounts[key]}`);
                });
                
                // Start the streaming loader
                console.log('🎬 Starting streaming VOB loader...');
                requestAnimationFrame(updateVOBStreaming);
                
            } catch (error) {
                console.error('❌ Failed to load VOBs:', error);
            }
        }

        // Streaming VOB loader - loads/unloads based on camera distance
        let vobLoadQueue = [];
        let isLoadingVOB = false;
        let isFirstVOBUpdate = true; // Force initial load
        
        async function updateVOBStreaming() {
            const camPos = camera.position;
            
            // Check if camera moved significantly OR if this is the first update
            const distance = lastCameraPosition.distanceTo(camPos);
            const shouldUpdate = isFirstVOBUpdate || distance > 100;
            
            if (shouldUpdate) {
                isFirstVOBUpdate = false; // Clear flag after first run
                lastCameraPosition.copy(camPos);
                
                // Find VOBs to load/unload
                vobLoadQueue = [];
                const toUnload = [];
                
                for (const vobData of allVOBs) {
                    const distance = camPos.distanceTo(vobData.position);
                    const isLoaded = loadedVOBs.has(vobData.id);
                    
                    if (distance < VOB_LOAD_DISTANCE && !isLoaded) {
                        vobLoadQueue.push(vobData);
                    } else if (distance > VOB_UNLOAD_DISTANCE && isLoaded) {
                        toUnload.push(vobData.id);
                    }
                }
                
                // Unload distant VOBs
                for (const id of toUnload) {
                    const mesh = loadedVOBs.get(id);
                    if (mesh) {
                        scene.remove(mesh);
                        disposeObject3D(mesh);
                        loadedVOBs.delete(id);
                    }
                }
                
                // Sort queue by distance (closest first)
                vobLoadQueue.sort((a, b) => {
                    return camPos.distanceTo(a.position) - camPos.distanceTo(b.position);
                });
            }
            
            // Load one VOB per frame to avoid lag
            if (!isLoadingVOB && vobLoadQueue.length > 0) {
                isLoadingVOB = true;
                const vobData = vobLoadQueue.shift();

                await renderVOB(vobData.vob, vobData.id);
                isLoadingVOB = false;
            }
            
            // Update debug info
            const statusEl = document.getElementById('status');
            if (statusEl && allVOBs.length > 0) {
                const loadedCount = loadedVOBs.size;
                const totalCount = allVOBs.length;
                const queueCount = vobLoadQueue.length;
                statusEl.innerHTML = `📦 VOBs: ${loadedCount}/${totalCount} loaded | Queue: ${queueCount} | Cache: ${meshCache.size} meshes, ${morphMeshCache.size} morphs, ${textureCache.size} textures`;
            }
            
            // Continue streaming
            requestAnimationFrame(updateVOBStreaming);
        }

        // Cached mesh loader
        async function loadMeshCached(meshPath) {
            // Check cache first
            if (meshCache.has(meshPath)) {
                return meshCache.get(meshPath);
            }
            
            try {
                const response = await fetch(meshPath);
                if (!response.ok) {
                    return null;
                }

                const arrayBuffer = await response.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);

                // Load mesh with ZenKit
                const vobMesh = ZenKit.createMesh();
                const isMRM = meshPath.toUpperCase().endsWith('.MRM');
                const loadResult = isMRM ? vobMesh.loadMRMFromArray(uint8Array) : vobMesh.loadFromArray(uint8Array);
                
                if (!loadResult || !loadResult.success) {
                    return null;
                }

                // Get processed mesh data
                const meshData = vobMesh.getMeshData();
                const processed = meshData.getProcessedMeshData();
                
                // Check if mesh has data
                if (processed.indices.size() === 0 || processed.vertices.size() === 0) {
                    return null;
                }
                
                // Cache and return
                meshCache.set(meshPath, processed);
                return processed;
            } catch (error) {
                console.warn(`Failed to load mesh ${meshPath}:`, error);
                return null;
            }
        }

        // Cached model loader for .MDL files
        async function loadModelCached(modelPath) {
            // Check cache first
            if (modelCache.has(modelPath)) {
                return modelCache.get(modelPath);
            }

            try {
                const response = await fetch(modelPath);
                if (!response.ok) {
                    return null;
                }

                const arrayBuffer = await response.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);

                // Load model with ZenKit
                const model = ZenKit.createModel();
                const loadResult = model.loadFromArray(uint8Array);

                if (!loadResult || !loadResult.success) {
                    console.warn(`Failed to load model ${modelPath}:`, model.getLastError());
                    return null;
                }

                if (!model.isLoaded) {
                    console.warn(`Model ${modelPath} loaded but reports not loaded`);
                    return null;
                }

                // Cache and return
                modelCache.set(modelPath, model);
                console.log(`✅ Loaded model ${modelPath}`);
                return model;
            } catch (error) {
                console.warn(`Failed to load model ${modelPath}:`, error);
                return null;
            }
        }

        // Cached morph mesh loader for .MMB files
        async function loadMorphMeshCached(morphPath) {
            // Check cache first
            if (morphMeshCache.has(morphPath)) {
                return morphMeshCache.get(morphPath);
            }

            try {
                const response = await fetch(morphPath);
                if (!response.ok) {
                    return null;
                }

                const arrayBuffer = await response.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);

                // Load morph mesh with ZenKit
                const morphMesh = ZenKit.createMorphMesh();
                const loadResult = morphMesh.loadFromArray(uint8Array);

                if (!loadResult || !loadResult.success) {
                    console.warn(`Failed to load morph mesh ${morphPath}:`, morphMesh.getLastError());
                    return null;
                }

                if (!morphMesh.isLoaded) {
                    console.warn(`Morph mesh ${morphPath} loaded but reports not loaded`);
                    return null;
                }

                // Get processed mesh data for rendering
                const processed = morphMesh.convertToProcessedMesh();
                const animationNames = morphMesh.getAnimationNames();
                const animationCount = animationNames.size();

                const result = {
                    morphMesh: morphMesh,
                    processed: processed,
                    animationCount: animationCount
                };

                // Cache and return
                morphMeshCache.set(morphPath, result);
                console.log(`✅ Loaded morph mesh ${morphPath} (${animationCount} animations available)`);
                return result;
            } catch (error) {
                console.warn(`Failed to load morph mesh ${morphPath}:`, error);
                return null;
            }
        }
        
        // Cached texture loader
        async function loadTextureCached(texturePath) {
            // Check cache first
            if (textureCache.has(texturePath)) {
                return textureCache.get(texturePath);
            }
            
            try {
                const tex = await loadCompiledTexAsDataTexture(texturePath);
                if (tex) {
                    textureCache.set(texturePath, tex);
                }
                return tex;
            } catch (error) {
                return null;
            }
        }
        
        // Cached material creator
        async function getMaterialCached(materialData) {
            const textureName = materialData.texture || '';
            
            // Check cache first
            if (materialCache.has(textureName)) {
                return materialCache.get(textureName);
            }
            
            // Create material
            const material = new THREE.MeshBasicMaterial({
                color: 0xFFFFFF,
                side: THREE.DoubleSide,
                transparent: false,  // Disable transparency for alpha-tested materials
                alphaTest: 0.5       // Use proper alpha test threshold like OpenGothic
            });
            
            // Load texture if available
            if (textureName && textureName.length) {
                const url = tgaNameToCompiledUrl(textureName);
                const tex = await loadTextureCached(url);
                if (tex) {
                    material.map = tex;
                    material.needsUpdate = true;
                }
            }
            
            // Cache and return
            materialCache.set(textureName, material);
            return material;
        }

        async function renderVOB(vob, vobId = null) {
            // Skip if no visual or visual disabled
            if (!vob.showVisual || !vob.visual.name) {
                return false;
            }

            const visualName = vob.visual.name;
            
            // Only render mesh visuals
            // Type 0 = DECAL (sprite/texture, not 3D mesh)
            // Type 1 = MESH (static 3D mesh)
            // Type 2 = MULTI_RESOLUTION_MESH (LOD mesh)
            // Type 3 = PARTICLE_EFFECT, 4 = AI_CAMERA, 5 = MODEL, 6 = MORPH_MESH
            if (vob.visual.type !== 1 && vob.visual.type !== 2 && vob.visual.type !== 5 && vob.visual.type !== 6) {
                return false; // Skip non-mesh visuals (decals, particles, etc.)
            }
            
            // Skip if visual name has texture extension (indicates it's not a mesh)
            if (visualName.toUpperCase().endsWith('.TEX') || visualName.toUpperCase().endsWith('.TGA')) {
                return false;
            }

                    // Handle different visual types
            if (vob.visual.type === 5) {
                // MODEL (5) - load .MDL file
                return await renderModelVOB(vob, vobId);
            } else if (vob.visual.type === 6) {
                // MORPH_MESH (6) - load .MMB file
                console.log(`🐟 Detected morph mesh VOB: ${visualName} (type: ${vob.visual.type})`);
                return await renderMorphMeshVOB(vob, vobId);
            } else {
                // MESH (1) or MULTI_RES_MESH (2) - load mesh file
            const meshPath = getMeshPath(visualName);
            if (!meshPath) {
                return false;
            }

                return await renderMeshVOB(vob, vobId, meshPath);
            }
        }

        // Shared function to build Three.js geometry and materials from processed mesh data
        async function buildThreeJSGeometryAndMaterials(processed) {
                const vertCount = processed.vertices.size();
                const idxCount = processed.indices.size();
                const matCount = processed.materials.size();

                // Build Three.js geometry
                const positions = new Float32Array(idxCount * 3);
                const normals = new Float32Array(idxCount * 3);
                const uvs = new Float32Array(idxCount * 2);

                for (let i = 0; i < idxCount; i++) {
                    const vertIdx = processed.indices.get(i);
                    const vertBase = vertIdx * 8;
                    
                    positions[i*3 + 0] = processed.vertices.get(vertBase + 0);
                    positions[i*3 + 1] = processed.vertices.get(vertBase + 1);
                    positions[i*3 + 2] = processed.vertices.get(vertBase + 2);
                    
                    normals[i*3 + 0] = processed.vertices.get(vertBase + 3);
                    normals[i*3 + 1] = processed.vertices.get(vertBase + 4);
                    normals[i*3 + 2] = processed.vertices.get(vertBase + 5);
                    
                    uvs[i*2 + 0] = processed.vertices.get(vertBase + 6);
                    uvs[i*2 + 1] = processed.vertices.get(vertBase + 7);
                }

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
                geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

                // Build material groups
                const triCount = processed.materialIds.size();
                geometry.clearGroups();
                
                let currentMatId = processed.materialIds.get(0);
                let groupStart = 0;
                
                for (let t = 1; t <= triCount; t++) {
                    const matId = (t < triCount) ? processed.materialIds.get(t) : -1;
                    
                    if (t === triCount || matId !== currentMatId) {
                        const vertexStart = groupStart * 3;
                        const vertexCount = (t - groupStart) * 3;
                        geometry.addGroup(vertexStart, vertexCount, currentMatId);
                        
                        groupStart = t;
                        currentMatId = matId;
                    }
                }

                // Build materials using cache
                const materialArray = [];
                for (let mi = 0; mi < matCount; mi++) {
                    const mat = processed.materials.get(mi);
                    const material = await getMaterialCached(mat);
                    materialArray.push(material);
                }

            return { geometry, materials: materialArray };
        }

        // Render mesh VOB (extracted from renderVOB)
        async function renderMeshVOB(vob, vobId, meshPath) {
            try {
                // Load mesh with caching
                const processed = await loadMeshCached(meshPath);
                if (!processed) {
                    return false;
                }

                // Build Three.js geometry and materials
                const { geometry, materials } = await buildThreeJSGeometryAndMaterials(processed);

                // Create mesh
                const vobMeshObj = new THREE.Mesh(geometry, materials);

                // Apply VOB transform
                applyVobTransform(vobMeshObj, vob);

                scene.add(vobMeshObj);

                // Register loaded VOB if we have an ID
                if (vobId) {
                    loadedVOBs.set(vobId, vobMeshObj);
                }

                return true; // Successfully rendered

            } catch (error) {
                console.warn(`Failed to render mesh VOB ${vob.visual.name}:`, error);
                return false;
            }
        }

        // Render model VOB (for MODEL and MORPH_MESH types)
        async function renderModelVOB(vob, vobId) {
            try {
                const visualName = vob.visual.name;

                // Build model path - convert to .MDL file
                const modelPath = getModelPath(visualName);
                if (!modelPath) {
                    return false;
                }

                // Load model with caching
                const model = await loadModelCached(modelPath);
                if (!model) {
                    return false;
                }

                // For now, render all attachments as a group
                // In the future, we could render SoftSkinMesh for animated characters
                const attachmentNames = model.getAttachmentNames();

                if (attachmentNames.size() === 0) {
                    console.log(`Model ${modelPath} has no attachments to render`);
                    return false;
                }

                // Get the model hierarchy to position attachments correctly
                const hierarchy = model.getHierarchy();

                // Create a group to hold all attachment meshes
                const modelGroup = new THREE.Group();

                // Helper function to accumulate transforms up the hierarchy chain
                function getAccumulatedTransform(nodeIndex) {
                    let currentIndex = nodeIndex;
                    let accumulatedMatrix = new THREE.Matrix4();

                    // Walk from leaf to root, accumulating transforms
                    while (currentIndex >= 0) {
                        const node = hierarchy.nodes.get ? hierarchy.nodes.get(currentIndex) : hierarchy.nodes[currentIndex];
                        const nodeTransform = node.getTransform();
                        const nodeMatrix = new THREE.Matrix4();

                        // Convert column-major matrix data to Three.js Matrix4
                        const matrixData = nodeTransform.toArray();
                        for (let i = 0; i < 16; i++) {
                            nodeMatrix.elements[i] = matrixData[i];
                        }

                        // Pre-multiply: accumulated = node * accumulated
                        const tempMatrix = new THREE.Matrix4();
                        tempMatrix.multiplyMatrices(nodeMatrix, accumulatedMatrix);
                        accumulatedMatrix = tempMatrix;

                        currentIndex = node.parentIndex;
                    }

                    return accumulatedMatrix;
                }

                // Render each attachment with proper positioning from hierarchy
                for (let i = 0; i < attachmentNames.size(); i++) {
                    const attachmentName = attachmentNames.get(i);
                    const attachment = model.getAttachment(attachmentName);
                    if (!attachment) continue;

                    // Find the corresponding hierarchy node for this attachment
                    // The attachment name should match a hierarchy node name
                    let hierarchyNodeIndex = -1;
                    const nodeCount = hierarchy.nodes.size ? hierarchy.nodes.size() : hierarchy.nodes.length;
                    for (let j = 0; j < nodeCount; j++) {
                        const node = hierarchy.nodes.get ? hierarchy.nodes.get(j) : hierarchy.nodes[j];
                        if (node && node.name === attachmentName) {
                            hierarchyNodeIndex = j;
                            break;
                        }
                    }

                    // Convert attachment to processed mesh data
                    const processed = model.convertAttachmentToProcessedMesh(attachment);
                    if (processed.indices.size() === 0 || processed.vertices.size() === 0) {
                        continue;
                    }

                    // Build Three.js geometry and materials using shared function
                    const { geometry, materials } = await buildThreeJSGeometryAndMaterials(processed);

                    // Create mesh for this attachment
                    const attachmentMesh = new THREE.Mesh(geometry, materials);

                    // Apply accumulated hierarchy transform if found
                    if (hierarchyNodeIndex >= 0) {
                        const accumulatedMatrix = getAccumulatedTransform(hierarchyNodeIndex);

                        attachmentMesh.applyMatrix4(accumulatedMatrix);
                    } else {
                        console.warn(`No hierarchy node found for attachment: ${attachmentName}`);
                    }

                    modelGroup.add(attachmentMesh);
                }

                // Apply VOB transform using the same approach as regular VOBs
                applyVobTransform(modelGroup, vob);

                scene.add(modelGroup);

                // Register loaded VOB if we have an ID
                if (vobId) {
                    loadedVOBs.set(vobId, modelGroup);
                }

                return true; // Successfully rendered

            } catch (error) {
                console.warn(`Failed to render model VOB ${vob.visual.name}:`, error);
                return false;
            }
        }

        // Render morph mesh VOB (for MORPH_MESH types)
        async function renderMorphMeshVOB(vob, vobId) {
            try {
                const visualName = vob.visual.name;

                // Build morph mesh path - convert to .MMB file
                const morphPath = getMorphMeshPath(visualName);
                if (!morphPath) {
                    return false;
                }

                // Load morph mesh with caching
                const morphData = await loadMorphMeshCached(morphPath);
                if (!morphData) {
                    return false;
                }

                // Build Three.js geometry and materials from processed mesh data
                const { geometry, materials } = await buildThreeJSGeometryAndMaterials(morphData.processed);

                if (!geometry) {
                    return false;
                }

                // Create mesh with materials
                const morphMesh = new THREE.Mesh(geometry, materials);

                // Apply VOB transform
                applyVobTransform(morphMesh, vob);

                scene.add(morphMesh);

                // Register loaded VOB if we have an ID
                if (vobId) {
                    loadedVOBs.set(vobId, morphMesh);
                }

                console.log(`✅ Rendered morph mesh VOB ${visualName} (${morphData.animationCount} animations available)`);

                return true; // Successfully rendered

            } catch (error) {
                console.warn(`Failed to render morph mesh VOB ${vob.visual.name}:`, error);
                return false;
            }
        }

        // Helper function to apply VOB transform to an object
        function applyVobTransform(object, vob) {
                // Apply VOB transform using OpenGothic's approach
                const rotArray = vob.rotation.toArray();
                const m = [];
                for (let i = 0; i < rotArray.size(); i++) {
                    m.push(rotArray.get(i));
                }
                

            // Build transform matrix exactly like OpenGothic does
                const transformMat = new THREE.Matrix4();
                transformMat.set(
                    -m[0], -m[3], -m[6], -vob.position.x,  // Negate X components for mirroring
                     m[1],  m[4],  m[7],  vob.position.y,
                     m[2],  m[5],  m[8],  vob.position.z,
                    0, 0, 0, 1
                );
                
                // Decompose matrix into position, quaternion, scale for Three.js
                const pos = new THREE.Vector3();
                const quat = new THREE.Quaternion();
                const scale = new THREE.Vector3();
                transformMat.decompose(pos, quat, scale);
                

            object.position.copy(pos);
            object.quaternion.copy(quat);
            object.scale.copy(scale);
        }


        // Helper function to properly dispose of Three.js objects (Meshes and Groups)
        function disposeObject3D(object) {
            if (!object) return;

            // If it's a Mesh, dispose its geometry
            if (object.geometry) {
                object.geometry.dispose();
            }

            // If it's a Group or has children, recursively dispose children
            if (object.children && object.children.length > 0) {
                for (const child of object.children) {
                    disposeObject3D(child);
                }
            }

            // Note: materials are cached and shared, don't dispose them
        }

        function getMeshPath(visualName) {
            if (!visualName || typeof visualName !== 'string') return null;
            
            const upper = visualName.toUpperCase();
            
            // Remove extension and get base name
            const base = upper.replace(/\.(3DS|MMS|ASC|TGA)$/i, '');
            
            // Meshes don't have -C suffix like textures do
            // Try .MRM (Multi-Resolution Mesh) first, then .MSH
            const possiblePaths = [
                `/public/game-assets/MESHES/_COMPILED/${base}.MRM`,
                `/public/game-assets/MESHES/_COMPILED/${base}.MSH`,
            ];
            
            // For now, return the first possibility (we'll check existence in fetch)
            return possiblePaths[0];
        }

        function getModelPath(visualName) {
            if (!visualName || typeof visualName !== 'string') return null;

            const upper = visualName.toUpperCase();

            // Remove extension if present and get base name
            const base = upper.replace(/\.(MDL|MDS|3DS|MMS|ASC|TGA)$/i, '');

            // Interactive models are stored in ANIMS/_COMPILED folder as .MDL files
            const modelPath = `/public/game-assets/ANIMS/_COMPILED/${base}.MDL`;

            return modelPath;
        }

        function getMorphMeshPath(visualName) {
            if (!visualName || typeof visualName !== 'string') return null;

            const upper = visualName.toUpperCase();

            // Remove extension if present and get base name
            const base = upper.replace(/\.(MMB|MMS|MMSB|MDS|3DS|ASC|TGA)$/i, '');

            // Morph meshes are stored in ANIMS/_COMPILED folder as .MMB files
            const morphPath = `/public/game-assets/ANIMS/_COMPILED/${base}.MMB`;

            return morphPath;
        }
        
        function onWindowResize() {
            const canvas = document.getElementById('threejs-canvas');
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        }
        
        
        
        // Load .TEX from compiled path via WASM and build a DataTexture
        async function loadCompiledTexAsDataTexture(url) {
            const res = await fetch(url);
            if (!res.ok) return null;
            const buf = await res.arrayBuffer();
            const arr = new Uint8Array(buf);
            const zkTex = new ZenKit.Texture();
            const ok = zkTex.loadFromArray(arr);
            if (!ok || !ok.success) return null;
            const w = zkTex.width;
            const h = zkTex.height;
            const rgba = zkTex.asRgba8(0);
            if (!rgba) return null;
            const tex = new THREE.DataTexture(rgba, w, h, THREE.RGBAFormat);
            tex.needsUpdate = true;
            tex.flipY = false;  // OpenGothic doesn't flip Y
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            // IMPORTANT: world UVs frequently exceed [0,1]; enable tiling
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.generateMipmaps = true;
            return tex;
        }

        function tgaNameToCompiledUrl(name) {
            if (!name || typeof name !== 'string') return null;
            const base = name.replace(/\.[^.]*$/, '').toUpperCase();
            return `/public/game-assets/TEXTURES/_COMPILED/${base}-C.TEX`;
        }

        // Initialize on page load
        initZenKit();
    </script>
