<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenKit MDS Viewer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .viewer-container {
            flex: 1;
            position: relative;
            background: #111;
        }

        #threejs-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .info-panel {
            width: 400px;
            background: #2a2a2a;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
        }

        .status {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #4a9eff;
        }

        .info-section {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .info-section h2 {
            margin-top: 0;
            color: #4a9eff;
            font-size: 1.2em;
        }

        .info-item {
            margin: 10px 0;
            padding: 8px;
            background: #1a1a1a;
            border-radius: 3px;
        }

        .info-label {
            font-weight: bold;
            color: #aaa;
        }

        .info-value {
            color: #fff;
            margin-left: 10px;
        }

        .animation-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .animation-item {
            background: #1a1a1a;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            border-left: 3px solid #4a9eff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .animation-item:hover {
            background: #252525;
        }

        .animation-item.active {
            background: #1a3a4a;
            border-left-color: #6ac5ff;
        }

        .animation-item h3 {
            margin: 0 0 8px 0;
            color: #4a9eff;
            font-size: 1em;
        }

        .animation-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 5px;
            font-size: 0.9em;
        }

        .error {
            background: #4a1a1a;
            border-left-color: #ff4a4a;
            color: #ffaaaa;
        }

        .success {
            background: #1a4a1a;
            border-left-color: #4aff4a;
            color: #aaffaa;
        }

        .controls-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
        }

        canvas:focus {
            outline: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="viewer-container">
            <canvas id="threejs-canvas"></canvas>
            
            <div id="status" class="controls-info">
                <div><strong>Loading Status:</strong></div>
                <div>Initializing ZenKit...</div>
            </div>

            <div class="controls-info" style="top: 120px;">
                <div><strong>Camera Controls:</strong></div>
                <div>Mouse: Click & drag to look around</div>
                <div>WASD / Arrows: Move</div>
                <div>Q/Space: Up | Z/Shift: Down</div>
                <div>Mouse wheel: Speed</div>
            </div>
        </div>

        <div class="info-panel">
            <h1>ZenKit MDS Viewer</h1>

            <div id="content" style="display: none;">
            <div class="info-section">
                <h2>Skeleton Information</h2>
                <div class="info-item">
                    <span class="info-label">Name:</span>
                    <span class="info-value" id="skeleton-name">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Mesh Disabled:</span>
                    <span class="info-value" id="skeleton-mesh-disabled">-</span>
                </div>
            </div>

            <div class="info-section">
                <h2>Meshes</h2>
                <div id="meshes-list"></div>
            </div>

            <div class="info-section">
                <h2>Disabled Animations</h2>
                <div id="disabled-animations-list"></div>
            </div>

            <div class="info-section">
                <h2>Animations</h2>
                <div class="animation-list" id="animations-list"></div>
            </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import Three.js from CDN
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.min.js';
        
        let ZenKit = null;
        let scene, camera, renderer;
        let modelMesh = null;
        let skeleton = null; // Store the skeleton bones
        let currentAnimation = null; // Current loaded animation
        let animationStartTime = 0;
        let isAnimationPlaying = false;
        let currentMdsBaseName = 'HumanS'; // Store the MDS base name
        
        // Asset caches
        const meshCache = new Map();
        const textureCache = new Map();
        const materialCache = new Map();
        const modelCache = new Map();
        const animationCache = new Map();
        
        // Camera control variables
        let moveSpeed = 10;
        let mouseSensitivity = 0.002;
        let pitch = 0, yaw = 0;
        let velocity = new THREE.Vector3();
        let isMouseDown = false;
        let lastMouseX = 0, lastMouseY = 0;

        function updateStatus(message, type = 'loading') {
            console.log(message);
            const statusEl = document.getElementById('status');
            if (statusEl) {
                const typeClass = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
                statusEl.innerHTML = `<div><strong>Loading Status:</strong></div><div class="${typeClass}">${message}</div>`;
            }
        }

        // Initialize Three.js Scene
        function initThreeJS() {
            const canvas = document.getElementById('threejs-canvas');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 1.0, 100000);
            camera.position.set(0, 100, 300);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                canvas, 
                antialias: true,
                logarithmicDepthBuffer: true
            });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(100, 100, 50);
            scene.add(directionalLight);
            
            // Simple orbit controls
            setupControls();
            
            // Handle resize
            window.addEventListener('resize', onWindowResize);
        }
        
        function setupControls() {
            const canvas = renderer.domElement;
            const keys = {};

            // Initialize camera orientation
            const initialDirection = new THREE.Vector3(0, 0, -1);
            initialDirection.applyQuaternion(camera.quaternion);
            yaw = Math.atan2(initialDirection.x, initialDirection.z);
            pitch = Math.asin(initialDirection.y);

            // Mouse controls for camera rotation
            canvas.addEventListener('mousedown', (event) => {
                isMouseDown = true;
                lastMouseX = event.clientX;
                lastMouseY = event.clientY;
                canvas.requestPointerLock();
            });

            document.addEventListener('mousemove', (event) => {
                if (!isMouseDown || document.pointerLockElement !== canvas) return;

                const deltaX = event.movementX || 0;
                const deltaY = event.movementY || 0;

                yaw -= deltaX * mouseSensitivity;
                pitch -= deltaY * mouseSensitivity;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));

                updateCameraOrientation();
            });

            canvas.addEventListener('mouseup', () => {
                isMouseDown = false;
                document.exitPointerLock();
            });

            // Keyboard controls for movement
            document.addEventListener('keydown', (event) => {
                keys[event.code] = true;
            });

            document.addEventListener('keyup', (event) => {
                keys[event.code] = false;
            });

            // Mouse wheel for movement speed
            canvas.addEventListener('wheel', (event) => {
                moveSpeed += event.deltaY * 0.1;
                moveSpeed = Math.max(1, Math.min(500, moveSpeed));
                event.preventDefault();
            });

            function updateCameraOrientation() {
                const quaternion = new THREE.Quaternion();
                quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                camera.quaternion.copy(quaternion);
            }

            function updateMovement() {
                velocity.set(0, 0, 0);

                const forward = new THREE.Vector3(0, 0, -1);
                const right = new THREE.Vector3(1, 0, 0);
                const up = new THREE.Vector3(0, 1, 0);

                forward.applyQuaternion(camera.quaternion);
                right.applyQuaternion(camera.quaternion);

                if (keys['KeyW'] || keys['ArrowUp']) {
                    velocity.add(forward);
                }
                if (keys['KeyS'] || keys['ArrowDown']) {
                    velocity.sub(forward);
                }
                if (keys['KeyA'] || keys['ArrowLeft']) {
                    velocity.sub(right);
                }
                if (keys['KeyD'] || keys['ArrowRight']) {
                    velocity.add(right);
                }
                if (keys['KeyQ'] || keys['Space']) {
                    velocity.add(up);
                }
                if (keys['KeyZ'] || keys['ShiftLeft']) {
                    velocity.sub(up);
                }

                if (velocity.length() > 0) {
                    velocity.normalize().multiplyScalar(moveSpeed);
                    camera.position.add(velocity);
                }
            }

            // Animation loop for smooth movement
            function animate() {
                updateMovement();
                
                // Update animation
                if (isAnimationPlaying && currentAnimation && skeleton) {
                    updateAnimation();
                }
                
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            animate();
        }

        function onWindowResize() {
            const canvas = document.getElementById('threejs-canvas');
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        }

        async function initZenKit() {
            try {
                const ZenKitModule = (await import('../build-wasm/wasm/zenkit.mjs')).default;
                ZenKit = await ZenKitModule();
                updateStatus(`✅ ZenKit ${ZenKit.getZenKitVersion()} initialized successfully!`, 'success');
                
                // Initialize Three.js
                initThreeJS();
                
                // Load MDS file
                await loadMdsFile('HumanS.mds');
                
            } catch (error) {
                updateStatus(`❌ Failed to initialize ZenKit: ${error.message}`, 'error');
                console.error('ZenKit initialization error:', error);
            }
        }

        async function loadMdsFile(mdsFileName = 'HumanS.mds') {
            try {
                updateStatus('📖 Loading MDS file...', 'loading');
                
                // Store the base name for later use with animations
                currentMdsBaseName = mdsFileName.replace(/\.(MDS|MSB)$/i, '');
                
                // Load MDS file from public/game-assets/ANIMS/
                const response = await fetch(`/public/game-assets/ANIMS/${mdsFileName}`);
                if (!response.ok) {
                    throw new Error(`Failed to fetch MDS file: ${response.status} ${response.statusText}`);
                }
                
                const arrayBuffer = await response.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                
                // Create ModelScript and load
                const mds = ZenKit.createModelScript();
                const loadResult = mds.loadFromArray(uint8Array);
                
                if (!loadResult.success) {
                    throw new Error(loadResult.errorMessage || mds.getLastError() || 'Unknown loading error');
                }
                
                updateStatus('✅ MDS file loaded successfully!', 'success');
                
                // Display information
                displayMdsInfo(mds);
                
                // Load and render the skeleton mesh (pass MDS filename for MDH lookup)
                await loadAndRenderSkeleton(mds, mdsFileName);
                
            } catch (error) {
                updateStatus(`❌ Failed to load MDS file: ${error.message}`, 'error');
                console.error('MDS loading error:', error);
            }
        }

        async function loadAndRenderSkeleton(mds, mdsFileName = 'HumanS.mds') {
            try {
                const skeletonName = mds.getSkeletonName();
                if (!skeletonName) {
                    updateStatus('⚠️ No skeleton name found in MDS', 'loading');
                    return;
                }

                updateStatus(`📦 Loading skeleton mesh: ${skeletonName}...`, 'loading');

                // Convert skeleton ASC to MDM base name (remove extension)
                const skeletonBaseName = skeletonName.replace(/\.(ASC|MDM|MDH|MDL)$/i, '').toUpperCase();
                
                // MDH name comes from MDS filename, not skeleton name
                // Convert MDS filename to base name (e.g., "HumanS.mds" -> "HUMANS")
                const mdsBaseName = mdsFileName.replace(/\.(MDS|MSB)$/i, '').toUpperCase();
                
                // Try loading MDL first (contains both hierarchy and mesh)
                // Try both skeleton name and MDS filename
                const mdlPath1 = `/public/game-assets/ANIMS/_COMPILED/${skeletonBaseName}.MDL`;
                const mdlPath2 = `/public/game-assets/ANIMS/_COMPILED/${mdsBaseName}.MDL`;
                let model = await loadModelCached(mdlPath1) || await loadModelCached(mdlPath2);
                
                if (!model) {
                    // Try loading MDH + MDM separately
                    // MDH uses MDS filename, MDM uses skeleton name
                    const mdhPath = `/public/game-assets/ANIMS/_COMPILED/${mdsBaseName}.MDH`;
                    const mdmPath = `/public/game-assets/ANIMS/_COMPILED/${skeletonBaseName}.MDM`;
                    
                    updateStatus(`📦 Trying MDH (${mdsBaseName}) + MDM (${skeletonBaseName})...`, 'loading');
                    
                    try {
                        // Load hierarchy (.MDH)
                        const mdhResponse = await fetch(mdhPath);
                        if (!mdhResponse.ok) {
                            throw new Error(`MDH not found: ${mdhPath}`);
                        }
                        
                        const mdhArrayBuffer = await mdhResponse.arrayBuffer();
                        const mdhUint8Array = new Uint8Array(mdhArrayBuffer);
                        
                        const hierarchyLoader = ZenKit.createModelHierarchyLoader();
                        const mdhLoadResult = hierarchyLoader.loadFromArray(mdhUint8Array);
                        
                        if (!mdhLoadResult || !mdhLoadResult.success) {
                            throw new Error(`Failed to load MDH: ${hierarchyLoader.getLastError()}`);
                        }
                        
                        // Load mesh (.MDM)
                        const mdmResponse = await fetch(mdmPath);
                        if (!mdmResponse.ok) {
                            throw new Error(`MDM not found: ${mdmPath}`);
                        }
                        
                        const mdmArrayBuffer = await mdmResponse.arrayBuffer();
                        const mdmUint8Array = new Uint8Array(mdmArrayBuffer);
                        
                        const meshLoader = ZenKit.createModelMeshLoader();
                        const mdmLoadResult = meshLoader.loadFromArray(mdmUint8Array);
                        
                        if (!mdmLoadResult || !mdmLoadResult.success) {
                            throw new Error(`Failed to load MDM: ${meshLoader.getLastError()}`);
                        }
                        
                        // Combine hierarchy and mesh into a Model
                        model = ZenKit.createModel();
                        model.setHierarchy(hierarchyLoader.getHierarchy());
                        model.setMesh(meshLoader.getMesh());
                        
                    } catch (error) {
                        updateStatus(`⚠️ Could not load MDH+MDM: ${error.message}`, 'loading');
                        return;
                    }
                }

                if (!model) {
                    updateStatus('⚠️ Could not load model mesh', 'loading');
                    return;
                }

                updateStatus('🎨 Rendering model...', 'loading');
                
                // Render the model
                await renderModel(model);
                
                updateStatus('✅ Model rendered successfully!', 'success');
                
            } catch (error) {
                updateStatus(`❌ Failed to load skeleton: ${error.message}`, 'error');
                console.error('Skeleton loading error:', error);
            }
        }

        async function loadModelCached(modelPath) {
            // Check cache first
            if (modelCache.has(modelPath)) {
                return modelCache.get(modelPath);
            }

            try {
                const response = await fetch(modelPath);
                
                // Check if file doesn't exist
                const contentType = response.headers.get('content-type') || '';
                const is404 = !response.ok || contentType.includes('text/html');
                
                if (is404) {
                    return null;
                }

                // Load .MDL file
                const arrayBuffer = await response.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);

                const model = ZenKit.createModel();
                const loadResult = model.loadFromArray(uint8Array);

                if (!loadResult || !loadResult.success) {
                    return null;
                }

                if (!model.isLoaded) {
                    return null;
                }

                // Cache and return
                modelCache.set(modelPath, model);
                return model;
            } catch (error) {
                return null;
            }
        }

        async function renderModel(model) {
            try {
                // Remove existing mesh
                if (modelMesh) {
                    scene.remove(modelMesh);
                    if (modelMesh.geometry) modelMesh.geometry.dispose();
                    if (Array.isArray(modelMesh.material)) {
                        modelMesh.material.forEach(m => m.dispose());
                    } else if (modelMesh.material) {
                        modelMesh.material.dispose();
                    }
                }

                // Get hierarchy to build skeleton
                const hierarchy = model.getHierarchy();
                
                // Build Three.js skeleton from hierarchy
                skeleton = buildSkeletonFromHierarchy(hierarchy);

                // Check for attachments first
                const attachmentNames = model.getAttachmentNames();
                const attachmentCount = attachmentNames.size();

                console.log(`📦 Model attachments: ${attachmentCount}`);
                for (let i = 0; i < attachmentCount; i++) {
                    console.log(`   - ${attachmentNames.get(i)}`);
                }

                if (attachmentCount === 0) {
                    // Try soft-skin meshes
                    const softSkinMeshes = model.getSoftSkinMeshes();
                    const softSkinCount = softSkinMeshes ? softSkinMeshes.size() : 0;
                    
                    console.log(`📦 Soft-skin meshes: ${softSkinCount}`);
                    
                    if (softSkinCount === 0) {
                        updateStatus('⚠️ Model has no renderable meshes', 'loading');
                        return;
                    }
                    
                    // Render soft-skin meshes
                    const modelGroup = new THREE.Group();
                    
                    // Add skeleton helper to the group
                    if (skeleton) {
                        modelGroup.add(skeleton);
                    }
                    
                    // List hierarchy nodes to find head bone
                    const nodeCount = hierarchy.nodes.size ? hierarchy.nodes.size() : hierarchy.nodes.length;
                    console.log(`📋 Hierarchy nodes: ${nodeCount}`);
                    let headNodeIndex = -1;
                    for (let j = 0; j < nodeCount; j++) {
                        const node = hierarchy.nodes.get ? hierarchy.nodes.get(j) : hierarchy.nodes[j];
                        const nodeName = node.name || '';
                        if (nodeName.toUpperCase().includes('HEAD') || nodeName === 'BIP01 HEAD') {
                            headNodeIndex = j;
                            console.log(`   ✅ Found head bone: ${nodeName} (index ${j})`);
                        }
                        if (j < 10) { // Show first 10 nodes
                            console.log(`   [${j}] ${nodeName} (parent: ${node.parentIndex})`);
                        }
                    }
                    if (nodeCount > 10) {
                        console.log(`   ... and ${nodeCount - 10} more nodes`);
                    }
                    
                    let rootNodeTranslation = new THREE.Vector3(0, 0, 0);
                    if (hierarchy.rootTranslation) {
                        rootNodeTranslation.set(
                            -hierarchy.rootTranslation.x,
                            -hierarchy.rootTranslation.y,
                            -hierarchy.rootTranslation.z
                        );
                    }
                    
                    console.log(`🎨 Root translation: (${rootNodeTranslation.x}, ${rootNodeTranslation.y}, ${rootNodeTranslation.z})`);
                    
                    let renderedCount = 0;
                    for (let i = 0; i < softSkinCount; i++) {
                        const softSkinMesh = softSkinMeshes.get(i);
                        if (!softSkinMesh) {
                            console.warn(`⚠️ Soft-skin mesh ${i} is null`);
                            continue;
                        }
                        
                        const processed = model.convertSoftSkinMeshToProcessedMesh(softSkinMesh);
                        const vertexCount = processed.vertices.size() / 8;
                        const triangleCount = processed.indices.size() / 3;
                        
                        console.log(`🎨 Soft-skin mesh ${i}: ${vertexCount} vertices, ${triangleCount} triangles`);
                        
                        if (processed.indices.size() === 0 || processed.vertices.size() === 0) {
                            console.warn(`⚠️ Soft-skin mesh ${i} has no geometry`);
                            continue;
                        }
                        
                        const { geometry, materials } = await buildThreeJSGeometryAndMaterials(processed);
                        const meshObj = new THREE.Mesh(geometry, materials);
                        meshObj.position.copy(rootNodeTranslation);
                        modelGroup.add(meshObj);
                        renderedCount++;
                    }
                    
                    console.log(`✅ Rendered ${renderedCount} soft-skin meshes`);
                    
                    // Try to load head mesh if head bone exists
                    if (headNodeIndex >= 0) {
                        await tryLoadHeadMesh(modelGroup, hierarchy, headNodeIndex);
                    }
                    
                    if (modelGroup.children.length === 0) {
                        updateStatus('⚠️ No meshes rendered', 'loading');
                        return;
                    }
                    
                    modelMesh = modelGroup;
                } else {
                    // Render attachments
                    const modelGroup = new THREE.Group();
                    
                    // Add skeleton helper to the group
                    if (skeleton) {
                        modelGroup.add(skeleton);
                    }

                    function getAccumulatedTransform(nodeIndex) {
                        let currentIndex = nodeIndex;
                        let accumulatedMatrix = new THREE.Matrix4();

                        while (currentIndex >= 0) {
                            const node = hierarchy.nodes.get ? hierarchy.nodes.get(currentIndex) : hierarchy.nodes[currentIndex];
                            const nodeTransform = node.getTransform();
                            const nodeMatrix = new THREE.Matrix4();

                            const matrixData = nodeTransform.toArray();
                            for (let i = 0; i < 16; i++) {
                                nodeMatrix.elements[i] = matrixData[i];
                            }

                            const tempMatrix = new THREE.Matrix4();
                            tempMatrix.multiplyMatrices(nodeMatrix, accumulatedMatrix);
                            accumulatedMatrix = tempMatrix;

                            currentIndex = node.parentIndex;
                        }

                        return accumulatedMatrix;
                    }

                    for (let i = 0; i < attachmentNames.size(); i++) {
                        const attachmentName = attachmentNames.get(i);
                        const attachment = model.getAttachment(attachmentName);
                        if (!attachment) {
                            console.warn(`⚠️ Attachment ${attachmentName} not found in model`);
                            continue;
                        }

                        let hierarchyNodeIndex = -1;
                        const nodeCount = hierarchy.nodes.size ? hierarchy.nodes.size() : hierarchy.nodes.length;
                        for (let j = 0; j < nodeCount; j++) {
                            const node = hierarchy.nodes.get ? hierarchy.nodes.get(j) : hierarchy.nodes[j];
                            if (node && node.name === attachmentName) {
                                hierarchyNodeIndex = j;
                                break;
                            }
                        }

                        console.log(`🎨 Rendering attachment: ${attachmentName} (node index: ${hierarchyNodeIndex})`);

                        const processed = model.convertAttachmentToProcessedMesh(attachment);
                        if (processed.indices.size() === 0 || processed.vertices.size() === 0) {
                            console.warn(`⚠️ Attachment ${attachmentName} has no geometry`);
                            continue;
                        }

                        const { geometry, materials } = await buildThreeJSGeometryAndMaterials(processed);
                        const attachmentMesh = new THREE.Mesh(geometry, materials);

                        if (hierarchyNodeIndex >= 0) {
                            const accumulatedMatrix = getAccumulatedTransform(hierarchyNodeIndex);
                            attachmentMesh.applyMatrix4(accumulatedMatrix);
                            console.log(`   ✅ Applied transform from hierarchy node ${hierarchyNodeIndex}`);
                        } else {
                            console.warn(`   ⚠️ No hierarchy node found for ${attachmentName}, rendering at origin`);
                        }

                        modelGroup.add(attachmentMesh);
                    }

                    if (modelGroup.children.length === 0) {
                        updateStatus('⚠️ No attachments rendered', 'loading');
                        return;
                    }

                    console.log(`✅ Rendered ${modelGroup.children.length} attachments`);
                    modelMesh = modelGroup;
                }

                // Center the model
                const box = new THREE.Box3().setFromObject(modelMesh);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                console.log(`📐 Model bounds: center=(${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)}), size=(${size.x.toFixed(2)}, ${size.y.toFixed(2)}, ${size.z.toFixed(2)})`);
                
                modelMesh.position.sub(center);

                scene.add(modelMesh);
                
                // Adjust camera to view the model
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(maxDim * 1.5, maxDim * 0.8, maxDim * 1.5);
                camera.lookAt(0, 0, 0);
                
                console.log(`📷 Camera positioned at: (${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)})`);
                
                renderer.render(scene, camera);
                
            } catch (error) {
                updateStatus(`❌ Failed to render model: ${error.message}`, 'error');
                console.error('Model rendering error:', error);
            }
        }

        function buildSkeletonFromHierarchy(hierarchy) {
            const nodeCount = hierarchy.nodes.size ? hierarchy.nodes.size() : hierarchy.nodes.length;
            const bones = [];
            const boneMatrices = [];

            // Create Three.js Bone objects for each node
            for (let i = 0; i < nodeCount; i++) {
                const node = hierarchy.nodes.get ? hierarchy.nodes.get(i) : hierarchy.nodes[i];
                const bone = new THREE.Bone();
                bone.name = node.name || `Bone_${i}`;
                bone.userData.nodeIndex = i;
                bone.userData.parentIndex = node.parentIndex;
                
                // Store the initial transform
                const nodeTransform = node.getTransform();
                const matrixData = nodeTransform.toArray();
                const matrix = new THREE.Matrix4();
                for (let j = 0; j < 16; j++) {
                    matrix.elements[j] = matrixData[j];
                }
                
                // Decompose matrix into position, rotation, scale
                const position = new THREE.Vector3();
                const quaternion = new THREE.Quaternion();
                const scale = new THREE.Vector3();
                matrix.decompose(position, quaternion, scale);
                
                bone.position.copy(position);
                bone.quaternion.copy(quaternion);
                bone.scale.copy(scale);
                
                bones.push(bone);
                boneMatrices.push(matrix.clone());
            }

            // Build bone hierarchy
            for (let i = 0; i < bones.length; i++) {
                const bone = bones[i];
                const parentIndex = bone.userData.parentIndex;
                
                if (parentIndex >= 0 && parentIndex < bones.length) {
                    bones[parentIndex].add(bone);
                }
            }

            // Find root bones (bones with no parent or parent index -1)
            const rootBones = bones.filter(b => b.userData.parentIndex < 0);
            
            // Create a container for the skeleton
            const skeletonRoot = new THREE.Group();
            skeletonRoot.name = 'SkeletonRoot';
            rootBones.forEach(bone => skeletonRoot.add(bone));

            // Store initial bone matrices for reference
            skeletonRoot.userData.bones = bones;
            skeletonRoot.userData.initialMatrices = boneMatrices;

            // Create a visual skeleton helper for debugging
            const threeSkeleton = new THREE.Skeleton(bones);
            const skeletonHelper = new THREE.SkeletonHelper(skeletonRoot);
            skeletonHelper.material.linewidth = 2;
            skeletonHelper.visible = true;
            skeletonRoot.add(skeletonHelper);
            skeletonRoot.userData.skeletonHelper = skeletonHelper;

            console.log(`🦴 Created skeleton with ${bones.length} bones, ${rootBones.length} root(s)`);
            
            return skeletonRoot;
        }

        async function loadAnimation(animationName) {
            try {
                // Check cache first
                if (animationCache.has(animationName)) {
                    return animationCache.get(animationName);
                }

                    // Build MAN filename using OpenGothic convention: {MDS_basename}-{animation_name}.MAN
                    // We explicitly IGNORE the 'model' (source ASC file) from the MDS, as OpenGothic does.
                    // See OpenGothic/game/graphics/mesh/animation.cpp: Animation::Animation constructor
                    const manFileName = `${currentMdsBaseName}-${animationName}.MAN`.toUpperCase();
                    const manPath = `/public/game-assets/ANIMS/_COMPILED/${manFileName}`;
                
                console.log(`🎬 Loading animation: ${manPath}`);
                updateStatus(`🎬 Loading animation: ${animationName}...`, 'loading');

                const response = await fetch(manPath);
                if (!response.ok) {
                    throw new Error(`Failed to fetch MAN file: ${response.status} ${response.statusText}`);
                }

                const arrayBuffer = await response.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);

                const animation = ZenKit.createModelAnimation();
                const loadResult = animation.loadFromArray(uint8Array);

                if (!loadResult.success) {
                    throw new Error(loadResult.errorMessage || animation.getLastError() || 'Unknown loading error');
                }

                // Cache the animation
                animationCache.set(animationName, animation);
                
                console.log(`✅ Loaded animation: ${animation.getName()}, ${animation.getFrameCount()} frames, ${animation.getFps()} fps`);
                updateStatus(`✅ Animation loaded: ${animationName}`, 'success');

                return animation;
            } catch (error) {
                updateStatus(`❌ Failed to load animation: ${error.message}`, 'error');
                console.error('Animation loading error:', error);
                return null;
            }
        }

        async function playAnimation(animationName) {
            try {
                if (!skeleton) {
                    console.warn('⚠️ No skeleton loaded, cannot play animation');
                    return;
                }

                // Load the animation
                const animation = await loadAnimation(animationName);
                if (!animation) {
                    return;
                }

                currentAnimation = animation;
                animationStartTime = Date.now();
                isAnimationPlaying = true;

                // Update UI to show active animation
                document.querySelectorAll('.animation-item').forEach(item => {
                    if (item.dataset.animationName === animationName) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });

                console.log(`▶️ Playing animation: ${animationName}`);
            } catch (error) {
                console.error('Error playing animation:', error);
                updateStatus(`❌ Error playing animation: ${error.message}`, 'error');
            }
        }

        function stopAnimation() {
            isAnimationPlaying = false;
            currentAnimation = null;
            
            // Remove active class from all animations
            document.querySelectorAll('.animation-item').forEach(item => {
                item.classList.remove('active');
            });
            
            console.log('⏹️ Animation stopped');
        }

        function updateAnimation() {
            if (!currentAnimation || !skeleton) {
                return;
            }

            const bones = skeleton.userData.bones;
            if (!bones) {
                return;
            }

            const frameCount = currentAnimation.getFrameCount();
            const fps = currentAnimation.getFps();
            const duration = (frameCount / fps) * 1000; // duration in milliseconds

            // Calculate current frame
            const elapsed = Date.now() - animationStartTime;
            const normalizedTime = (elapsed % duration) / duration; // 0 to 1, looping
            const currentFrame = Math.floor(normalizedTime * frameCount);

            // Apply animation samples to bones
            const nodeCount = currentAnimation.getNodeCount();
            
            for (let nodeIdx = 0; nodeIdx < nodeCount; nodeIdx++) {
                const boneIndex = currentAnimation.getNodeIndex(nodeIdx);
                
                if (boneIndex >= 0 && boneIndex < bones.length) {
                    const bone = bones[boneIndex];
                    const sample = currentAnimation.getSample(currentFrame, nodeIdx);
                    
                    // Check if sample exists and has valid data
                    if (sample && sample.position && sample.rotation) {
                        const pos = sample.position;
                        const rot = sample.rotation;
                        
                        // Apply position
                        bone.position.set(pos.x, pos.y, pos.z);
                        
                        // Apply rotation (quaternion)
                        bone.quaternion.set(rot.x, rot.y, rot.z, rot.w);
                    }
                }
            }

            // Update the skeleton hierarchy
            // The SkeletonHelper will automatically update when we update the world matrix
            skeleton.updateMatrixWorld(true);
        }

        async function buildThreeJSGeometryAndMaterials(processed) {
            const idxCount = processed.indices.size();
            const matCount = processed.materials.size();

            // Build Three.js geometry
            const positions = new Float32Array(idxCount * 3);
            const normals = new Float32Array(idxCount * 3);
            const uvs = new Float32Array(idxCount * 2);

            for (let i = 0; i < idxCount; i++) {
                const vertIdx = processed.indices.get(i);
                const vertBase = vertIdx * 8;
                
                positions[i*3 + 0] = processed.vertices.get(vertBase + 0);
                positions[i*3 + 1] = processed.vertices.get(vertBase + 1);
                positions[i*3 + 2] = processed.vertices.get(vertBase + 2);
                
                normals[i*3 + 0] = processed.vertices.get(vertBase + 3);
                normals[i*3 + 1] = processed.vertices.get(vertBase + 4);
                normals[i*3 + 2] = processed.vertices.get(vertBase + 5);
                
                uvs[i*2 + 0] = processed.vertices.get(vertBase + 6);
                uvs[i*2 + 1] = processed.vertices.get(vertBase + 7);
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
            geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

            // Build material groups
            const triCount = processed.materialIds.size();
            geometry.clearGroups();
            
            let currentMatId = processed.materialIds.get(0);
            let groupStart = 0;
            
            for (let t = 1; t <= triCount; t++) {
                const matId = (t < triCount) ? processed.materialIds.get(t) : -1;
                
                if (t === triCount || matId !== currentMatId) {
                    const vertexStart = groupStart * 3;
                    const vertexCount = (t - groupStart) * 3;
                    geometry.addGroup(vertexStart, vertexCount, currentMatId);
                    
                    groupStart = t;
                    currentMatId = matId;
                }
            }

            // Build materials
            const materialArray = [];
            for (let mi = 0; mi < matCount; mi++) {
                const mat = processed.materials.get(mi);
                const material = await getMaterialCached(mat);
                materialArray.push(material);
            }

            return { geometry, materials: materialArray };
        }

        async function getMaterialCached(materialData) {
            const textureName = materialData.texture || '';
            
            if (materialCache.has(textureName)) {
                return materialCache.get(textureName);
            }
            
            const material = new THREE.MeshPhongMaterial({
                color: 0xFFFFFF,
                side: THREE.DoubleSide,
                transparent: false,
                alphaTest: 0.5
            });
            
            if (textureName && textureName.length) {
                const url = tgaNameToCompiledUrl(textureName);
                const tex = await loadTextureCached(url);
                if (tex) {
                    material.map = tex;
                    material.needsUpdate = true;
                }
            }
            
            materialCache.set(textureName, material);
            return material;
        }

        async function loadTextureCached(texturePath) {
            if (textureCache.has(texturePath)) {
                return textureCache.get(texturePath);
            }
            
            try {
                const tex = await loadCompiledTexAsDataTexture(texturePath);
                if (tex) {
                    textureCache.set(texturePath, tex);
                }
                return tex;
            } catch (error) {
                return null;
            }
        }

        async function loadCompiledTexAsDataTexture(url) {
            const res = await fetch(url);
            if (!res.ok) return null;
            const buf = await res.arrayBuffer();
            const arr = new Uint8Array(buf);
            const zkTex = new ZenKit.Texture();
            const ok = zkTex.loadFromArray(arr);
            if (!ok || !ok.success) return null;
            const w = zkTex.width;
            const h = zkTex.height;
            const rgba = zkTex.asRgba8(0);
            if (!rgba) return null;
            const tex = new THREE.DataTexture(rgba, w, h, THREE.RGBAFormat);
            tex.needsUpdate = true;
            tex.flipY = false;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.generateMipmaps = true;
            return tex;
        }

        function tgaNameToCompiledUrl(name) {
            if (!name || typeof name !== 'string') return null;
            const base = name.replace(/\.[^.]*$/, '').toUpperCase();
            return `/public/game-assets/TEXTURES/_COMPILED/${base}-C.TEX`;
        }

        async function tryLoadHeadMesh(modelGroup, hierarchy, headNodeIndex) {
            try {
                // Try common head mesh names
                const headMeshNames = [
                    'HUM_HEAD',
                    'HUM_HEAD_BABE',
                    'HUM_HEAD_BABE1',
                    'HUM_HEAD_BABE2'
                ];

                for (const headName of headMeshNames) {
                    const headMmbPath = `/public/game-assets/ANIMS/_COMPILED/${headName}.MMB`;
                    
                    try {
                        const response = await fetch(headMmbPath);
                        if (!response.ok) continue;

                        updateStatus(`📦 Loading head mesh: ${headName}...`, 'loading');
                        
                        const arrayBuffer = await response.arrayBuffer();
                        const uint8Array = new Uint8Array(arrayBuffer);

                        const morphMesh = ZenKit.createMorphMesh();
                        const loadResult = morphMesh.loadFromArray(uint8Array);

                        if (!loadResult || !loadResult.success) {
                            continue;
                        }

                        const processed = morphMesh.convertToProcessedMesh();
                        if (processed.indices.size() === 0 || processed.vertices.size() === 0) {
                            continue;
                        }

                        const { geometry, materials } = await buildThreeJSGeometryAndMaterials(processed);
                        const headMesh = new THREE.Mesh(geometry, materials);

                        // Get head bone transform
                        const node = hierarchy.nodes.get ? hierarchy.nodes.get(headNodeIndex) : hierarchy.nodes[headNodeIndex];
                        if (node) {
                            const nodeTransform = node.getTransform();
                            const nodeMatrix = new THREE.Matrix4();
                            const matrixData = nodeTransform.toArray();
                            for (let i = 0; i < 16; i++) {
                                nodeMatrix.elements[i] = matrixData[i];
                            }

                            // Apply accumulated transform from root
                            function getAccumulatedTransform(nodeIndex) {
                                let currentIndex = nodeIndex;
                                let accumulatedMatrix = new THREE.Matrix4();

                                while (currentIndex >= 0) {
                                    const n = hierarchy.nodes.get ? hierarchy.nodes.get(currentIndex) : hierarchy.nodes[currentIndex];
                                    const nTransform = n.getTransform();
                                    const nMatrix = new THREE.Matrix4();
                                    const nData = nTransform.toArray();
                                    for (let i = 0; i < 16; i++) {
                                        nMatrix.elements[i] = nData[i];
                                    }

                                    const tempMatrix = new THREE.Matrix4();
                                    tempMatrix.multiplyMatrices(nMatrix, accumulatedMatrix);
                                    accumulatedMatrix = tempMatrix;

                                    currentIndex = n.parentIndex;
                                }

                                return accumulatedMatrix;
                            }

                            const accumulatedMatrix = getAccumulatedTransform(headNodeIndex);
                            headMesh.applyMatrix4(accumulatedMatrix);
                        }

                        modelGroup.add(headMesh);
                        console.log(`✅ Loaded and attached head mesh: ${headName}`);
                        updateStatus(`✅ Head mesh loaded: ${headName}`, 'success');
                        return; // Successfully loaded head
                    } catch (error) {
                        // Try next head mesh name
                        continue;
                    }
                }

                console.log(`⚠️ No head mesh found (tried: ${headMeshNames.join(', ')})`);
            } catch (error) {
                console.warn(`⚠️ Failed to load head mesh: ${error.message}`);
            }
        }

        function displayMdsInfo(mds) {
            // Show content
            document.getElementById('content').style.display = 'block';
            
            // Skeleton info
            document.getElementById('skeleton-name').textContent = mds.getSkeletonName() || '(none)';
            document.getElementById('skeleton-mesh-disabled').textContent = mds.isSkeletonMeshDisabled() ? 'Yes' : 'No';
            
            // Meshes
            const meshCount = mds.getMeshCount();
            const meshesList = document.getElementById('meshes-list');
            if (meshCount === 0) {
                meshesList.innerHTML = '<div class="info-item">No meshes defined</div>';
            } else {
                meshesList.innerHTML = '';
                for (let i = 0; i < meshCount; i++) {
                    const meshName = mds.getMeshName(i);
                    const item = document.createElement('div');
                    item.className = 'info-item';
                    item.textContent = `${i + 1}. ${meshName}`;
                    meshesList.appendChild(item);
                }
            }
            
            // Disabled animations
            const disabledCount = mds.getDisabledAnimationCount();
            const disabledList = document.getElementById('disabled-animations-list');
            if (disabledCount === 0) {
                disabledList.innerHTML = '<div class="info-item">No disabled animations</div>';
            } else {
                disabledList.innerHTML = '';
                for (let i = 0; i < disabledCount; i++) {
                    const animName = mds.getDisabledAnimationName(i);
                    const item = document.createElement('div');
                    item.className = 'info-item';
                    item.textContent = animName;
                    disabledList.appendChild(item);
                }
            }
            
            // Animations - make them clickable
            const animCount = mds.getAnimationCount();
            const animationsList = document.getElementById('animations-list');
            if (animCount === 0) {
                animationsList.innerHTML = '<div class="info-item">No animations defined</div>';
            } else {
                animationsList.innerHTML = '';
                for (let i = 0; i < animCount; i++) {
                    const animItem = document.createElement('div');
                    animItem.className = 'animation-item';
                    
                    const name = mds.getAnimationName(i);
                    const layer = mds.getAnimationLayer(i);
                    const next = mds.getAnimationNext(i);
                    const blendIn = mds.getAnimationBlendIn(i);
                    const blendOut = mds.getAnimationBlendOut(i);
                    const flags = mds.getAnimationFlags(i);
                    const model = mds.getAnimationModel(i);
                    const firstFrame = mds.getAnimationFirstFrame(i);
                    const lastFrame = mds.getAnimationLastFrame(i);
                    const fps = mds.getAnimationFps(i);
                    const speed = mds.getAnimationSpeed(i);
                    
                    // Calculate expected MAN filename for display
                    const manName = `${currentMdsBaseName}-${name}.MAN`.toUpperCase();
                    
                    animItem.innerHTML = `
                        <h3>🎬 ${name}</h3>
                        <div class="animation-details">
                            <div><span class="info-label">Layer:</span> <span class="info-value">${layer}</span></div>
                            <div><span class="info-label">Next:</span> <span class="info-value">${next || '(none)'}</span></div>
                            <div><span class="info-label">Blend In:</span> <span class="info-value">${blendIn.toFixed(2)}</span></div>
                            <div><span class="info-label">Blend Out:</span> <span class="info-value">${blendOut.toFixed(2)}</span></div>
                            <div><span class="info-label">Flags:</span> <span class="info-value">0x${flags.toString(16)}</span></div>
                            <div><span class="info-label">Source:</span> <span class="info-value">${model || '(none)'}</span></div>
                            <div><span class="info-label">Compiled:</span> <span class="info-value">${manName}</span></div>
                            <div><span class="info-label">Frames:</span> <span class="info-value">${firstFrame} - ${lastFrame}</span></div>
                            <div><span class="info-label">FPS:</span> <span class="info-value">${fps.toFixed(2)}</span></div>
                            <div><span class="info-label">Speed:</span> <span class="info-value">${speed.toFixed(2)}</span></div>
                        </div>
                        <div style="margin-top: 8px; font-size: 0.85em; color: #888;">
                            💡 Click to play animation
                        </div>
                    `;
                    
                    // Store animation name as data attribute
                    animItem.dataset.animationName = name;
                    
                    // Add click handler to play animation
                    animItem.addEventListener('click', () => {
                        if (animItem.classList.contains('active')) {
                            stopAnimation();
                        } else {
                            playAnimation(name);
                        }
                    });
                    
                    animationsList.appendChild(animItem);
                }
            }
            
            console.log(`✅ Displayed MDS information:`);
            console.log(`   - Skeleton: ${mds.getSkeletonName()}`);
            console.log(`   - Meshes: ${meshCount}`);
            console.log(`   - Disabled animations: ${disabledCount}`);
            console.log(`   - Animations: ${animCount}`);
        }

        // Initialize on page load
        initZenKit();
    </script>
