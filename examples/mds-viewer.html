        async function loadMdsFile(mdsFileName = DEFAULT_MDS, overlayFileName = null) {
            try {
                updateStatus('📖 Loading MDS file...', 'loading');

                // Store the base name (without path/ext) for later use with animations
                const mdsFileOnly = mdsFileName.split('/').pop() || mdsFileName;
                currentMdsBaseName = mdsFileOnly.replace(/\.(MDS|MSB)$/i, '');
                overlayAnimations = [];
                overlayDisabled = [];

                // Load MDS file from public/game-assets/ANIMS/
                const response = await fetch(`/public/game-assets/ANIMS/${mdsFileName}`);
                if (!response.ok) {
                    throw new Error(`Failed to fetch MDS file: ${response.status} ${response.statusText}`);
                }

                const arrayBuffer = await response.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);

                // Create ModelScript and load
                const mds = ZenKit.createModelScript();
                const loadResult = mds.loadFromArray(uint8Array);

                if (!loadResult.success) {
                    throw new Error(loadResult.errorMessage || mds.getLastError() || 'Unknown loading error');
                }

                updateStatus('✅ MDS file loaded successfully!', 'success');

                // If overlay requested, load it for animations only
                if (overlayFileName) {
                    try {
                        const ovFileOnly = overlayFileName.split('/').pop() || overlayFileName;
                        const ovBaseName = ovFileOnly.replace(/\.(MDS|MSB)$/i, '').toUpperCase();
                        const ovResp = await fetch(`/public/game-assets/ANIMS/${overlayFileName}`);
                        if (ovResp.ok) {
                            const ovBuf = await ovResp.arrayBuffer();
                            const ovU8 = new Uint8Array(ovBuf);
                            const ovMds = ZenKit.createModelScript();
                            const ovRes = ovMds.loadFromArray(ovU8);
                            if (ovRes.success) {
                                const ovAnimCount = ovMds.getAnimationCount();
                                for (let i = 0; i < ovAnimCount; i++) {
                                    overlayAnimations.push({
                                        name: ovMds.getAnimationName(i),
                                        layer: ovMds.getAnimationLayer(i),
                                        next: ovMds.getAnimationNext(i),
                                        blendIn: ovMds.getAnimationBlendIn(i),
                                        blendOut: ovMds.getAnimationBlendOut(i),
                                        flags: ovMds.getAnimationFlags(i),
                                        model: ovMds.getAnimationModel(i),
                                        firstFrame: ovMds.getAnimationFirstFrame(i),
                                        lastFrame: ovMds.getAnimationLastFrame(i),
                                        fps: ovMds.getAnimationFps(i),
                                        speed: ovMds.getAnimationSpeed(i),
                                        sourceBase: ovBaseName
                                    });
                                }
                                const ovDisabledCount = ovMds.getDisabledAnimationCount();
                                for (let i = 0; i < ovDisabledCount; i++) {
                                    overlayDisabled.push(ovMds.getDisabledAnimationName(i));
                                }
                            }
                        }
                    } catch (e) {
                        console.warn(`Failed to load overlay MDS ${overlayFileName}: ${e.message}`);
                    }
                }

                // Display information (base + overlay animations)
                displayMdsInfo(mds, overlayAnimations, overlayDisabled);

                // Load and render the skeleton mesh (pass MDS filename for MDH lookup)
                await loadAndRenderSkeleton(mds, mdsFileName);

            } catch (error) {
                updateStatus(`❌ Failed to load MDS file: ${error.message}`, 'error');
                console.error('MDS loading error:', error);
            }
        }

        async function loadAndRenderSkeleton(mds, mdsFileName = DEFAULT_MDS) {
            try {
                const mdsSkeletonName = mds.getSkeletonName();
                const mdsFileOnly = mdsFileName.split('/').pop() || mdsFileName;

                // Decide if we must force female rig (e.g., overlay without skeleton or specific overlay file)
                const forcedMdmName = 'HUM_BODY_BABE0';
                // Always use base humans hierarchy to match original game behavior
                const forcedMdhName = 'HUMANS';
                const isBabeOverlay = mdsFileName.toLowerCase().includes('mds_overlay/humans_babe');
                const useForced = FORCE_FEMALE_BODY || !mdsSkeletonName || isBabeOverlay;

                let skeletonBaseName;
                
                // If user selected a specific mesh, use it
                if (activeMeshName) {
                    skeletonBaseName = activeMeshName.replace(/\.(ASC|MDM|MDH|MDL)$/i, '').toUpperCase();
                    console.log(`🎯 Using user-selected mesh: ${skeletonBaseName}`);
                } else if (useForced) {
                    skeletonBaseName = forcedMdmName;
                } else {
                    skeletonBaseName = mdsSkeletonName.replace(/\.(ASC|MDM|MDH|MDL)$/i, '').toUpperCase();
                }
                
                // Override for testing Raven Armor (male) - only if no user selection
                if (!activeMeshName && !FORCE_FEMALE_BODY && skeletonBaseName === 'HUM_BODY_NAKED0') {
                    skeletonBaseName = 'ARMOR_RAVEN_ADDON';
                    console.log('🦅 Testing with Raven Armor instead of naked body');
                }
                
                const mdsBaseName = useForced
                    ? forcedMdhName
                    : mdsFileOnly.replace(/\.(MDS|MSB)$/i, '').toUpperCase();
                const skeletonName = `${skeletonBaseName}.MDM`;
                currentSkeletonBaseName = skeletonBaseName;

                updateStatus(
                    useForced
                        ? `📦 Loading skeleton mesh (forced): ${forcedMdhName}.MDH + ${forcedMdmName}.MDM`
                        : `📦 Loading skeleton mesh: ${skeletonName}...`,
                    'loading'
                );

                // Load MDH + MDM directly (MDL not available in provided assets)
                let model = null;
                const mdhPath = `/public/game-assets/ANIMS/_COMPILED/${mdsBaseName}.MDH`;
                const mdmPath = `/public/game-assets/ANIMS/_COMPILED/${skeletonBaseName}.MDM`;

                updateStatus(`📦 Loading MDH (${mdsBaseName}) + MDM (${skeletonBaseName})...`, 'loading');

                try {
                    // Load hierarchy (.MDH)
                    const mdhResponse = await fetch(mdhPath);
                    if (!mdhResponse.ok) {
                        throw new Error(`MDH not found: ${mdhPath}`);
                    }

                    const mdhArrayBuffer = await mdhResponse.arrayBuffer();
                    const mdhUint8Array = new Uint8Array(mdhArrayBuffer);

                    const hierarchyLoader = ZenKit.createModelHierarchyLoader();
                    const mdhLoadResult = hierarchyLoader.loadFromArray(mdhUint8Array);

                    if (!mdhLoadResult || !mdhLoadResult.success) {
                        throw new Error(`Failed to load MDH: ${hierarchyLoader.getLastError()}`);
                    }

                    // Load mesh (.MDM)
                    const mdmResponse = await fetch(mdmPath);
                    if (!mdmResponse.ok) {
                        throw new Error(`MDM not found: ${mdmPath}`);
                    }

                    const mdmArrayBuffer = await mdmResponse.arrayBuffer();
                    const mdmUint8Array = new Uint8Array(mdmArrayBuffer);

                    const meshLoader = ZenKit.createModelMeshLoader();
                    const mdmLoadResult = meshLoader.loadFromArray(mdmUint8Array);

                    if (!mdmLoadResult || !mdmLoadResult.success) {
                        throw new Error(`Failed to load MDM: ${meshLoader.getLastError()}`);
                    }

                    // Combine hierarchy and mesh into a Model
                    model = ZenKit.createModel();
                    model.setHierarchy(hierarchyLoader.getHierarchy());
                    model.setMesh(meshLoader.getMesh());

                } catch (error) {
                    updateStatus(`⚠️ Could not load MDH+MDM: ${error.message}`, 'loading');
                    return;
                }

                if (!model) {
                    updateStatus('⚠️ Could not load model mesh', 'loading');
                    return;
                }

                updateStatus('🎨 Rendering model...', 'loading');

                // Render the model
                await renderModel(model);

                updateStatus('✅ Model rendered successfully!', 'success');

            } catch (error) {
                updateStatus(`❌ Failed to load skeleton: ${error.message}`, 'error');
                console.error('Skeleton loading error:', error);
            }
        }

        async function loadModelCached(modelPath) {
            // Check cache first
            if (modelCache.has(modelPath)) {
                return modelCache.get(modelPath);
            }

            try {
                const response = await fetch(modelPath);

                // Check if file doesn't exist
                const contentType = response.headers.get('content-type') || '';
                const is404 = !response.ok || contentType.includes('text/html');

                if (is404) {
                    return null;
                }

                // Load .MDL file
                const arrayBuffer = await response.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);

                const model = ZenKit.createModel();
                const loadResult = model.loadFromArray(uint8Array);

                if (!loadResult || !loadResult.success) {
                    return null;
                }

                if (!model.isLoaded) {
                    return null;
                }

                // Cache and return
                modelCache.set(modelPath, model);
                return model;
            } catch (error) {
                return null;
            }
        }

        function createBoneLabel(text) {
            const canvas = document.createElement('canvas');
            const size = 96;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, size, size);
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(8, 8, size - 16, size - 16);
            ctx.fillStyle = '#00ff00';
            ctx.font = '24px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, size / 2, size / 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            const material = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(4, 4, 1);
            return sprite;
        }

        async function renderModel(model) {
            try {
                // Remove existing mesh
                if (modelMesh) {
                    scene.remove(modelMesh);
                    if (modelMesh.geometry) modelMesh.geometry.dispose();
                    if (Array.isArray(modelMesh.material)) {
                        modelMesh.material.forEach(m => m.dispose());
                    } else if (modelMesh.material) {
                        modelMesh.material.dispose();
                    }
                }
                if (skeletonHelper) {
                    scene.remove(skeletonHelper);
                    if (skeletonHelper.material) skeletonHelper.material.dispose();
                    skeletonHelper = null;
                }
                if (boneLabels.length) {
                    for (const label of boneLabels) {
                        if (label.parent) label.parent.remove(label);
                        if (label.material && label.material.map) label.material.map.dispose();
                        if (label.material) label.material.dispose();
                    }
                    boneLabels = [];
                }
                if (headPivotHelper) {
                    if (headPivotHelper.parent) {
                        headPivotHelper.parent.remove(headPivotHelper);
                    }
                    headPivotHelper = null;
                }

                // Get hierarchy to build skeleton
                const hierarchy = model.getHierarchy();

                // Load reference model (HUM_BODY_NAKED0) for offset calculation
                let referenceModel = null;
                let referenceMesh = null;
                try {
                    const refMdmPath = `/public/game-assets/ANIMS/_COMPILED/HUM_BODY_NAKED0.MDM`;
                    const refResponse = await fetch(refMdmPath);
                    if (refResponse.ok) {
                        const refBuffer = await refResponse.arrayBuffer();
                        const refUint8Array = new Uint8Array(refBuffer);
                        const refMeshLoader = ZenKit.createModelMeshLoader();
                        const refLoadResult = refMeshLoader.loadFromArray(refUint8Array);
                        if (refLoadResult && refLoadResult.success) {
                            referenceModel = ZenKit.createModel();
                            referenceModel.setMesh(refMeshLoader.getMesh());
                            const refMeshes = referenceModel.getSoftSkinMeshes();
                            if (refMeshes.size() > 0) {
                                referenceMesh = refMeshes.get(0);
                                console.log('✅ Loaded reference model (HUM_BODY_NAKED0) for offset calculation');
                            }
                        }
                    }
                } catch (err) {
                    console.warn('⚠️ Could not load reference model:', err);
                }


                // Build custom Skeleton class (mimics OpenGothic)
                skeleton = new Skeleton(hierarchy);

                // Log skeleton structure for arm/hand bones
                console.log('🦴 Skeleton bone structure (arm/hand bones):');
                for (let i = 0; i < skeleton.bones.length; i++) {
                    const boneName = skeleton.bones[i].name?.toLowerCase() || '';
                    if (boneName.includes('arm') || boneName.includes('hand') || boneName.includes('finger')) {
                        const node = skeleton.nodes[i];
                        console.log(`  [${i}] ${skeleton.bones[i].name} (parent: ${node.parent})`);
                    }
                }

                // Initialize Pose
                pose = new Pose(skeleton);

                // Initialize Animation
                if (!animation) {
                    animation = new Animation();
                }

                // Check for attachments first
                const attachmentNames = model.getAttachmentNames();
                const attachmentCount = attachmentNames.size();

                console.log(`📦 Model attachments: ${attachmentCount}`);
                for (let i = 0; i < attachmentCount; i++) {
                    console.log(`   - ${attachmentNames.get(i)}`);
                }

                if (attachmentCount === 0) {
                    // Try soft-skin meshes
                    const softSkinMeshes = model.getSoftSkinMeshes();
                    const softSkinCount = softSkinMeshes ? softSkinMeshes.size() : 0;

                    console.log(`📦 Soft-skin meshes: ${softSkinCount}`);

                    if (softSkinCount === 0) {
                        updateStatus('⚠️ Model has no renderable meshes', 'loading');
                        return;
                    }

                    // Render soft-skin meshes
                    const modelGroup = new THREE.Group();

                    // List hierarchy nodes to find head bone
                    const nodeCount = hierarchy.nodes.size ? hierarchy.nodes.size() : hierarchy.nodes.length;
                    console.log(`📋 Hierarchy nodes: ${nodeCount}`);
                    headNodeIndex = -1; // Use global variable
                    for (let j = 0; j < nodeCount; j++) {
                        const node = hierarchy.nodes.get ? hierarchy.nodes.get(j) : hierarchy.nodes[j];
                        const nodeName = node.name || '';
                        if (nodeName.toUpperCase().includes('HEAD') || nodeName === 'BIP01 HEAD') {
                            headNodeIndex = j;
                            console.log(`   ✅ Found head bone: ${nodeName} (index ${j})`);
                        }
                        if (j < 10) { // Show first 10 nodes
                            console.log(`   [${j}] ${nodeName} (parent: ${node.parentIndex})`);
                        }
                    }
                    if (nodeCount > 10) {
                        console.log(`   ... and ${nodeCount - 10} more nodes`);
                    }
                    // Attach a small axes helper to visualize the head pivot/origin
                    if (headNodeIndex >= 0 && skeleton && skeleton.bones && headNodeIndex < skeleton.bones.length) {
                        const headBone = skeleton.bones[headNodeIndex];
                        if (headPivotHelper && headPivotHelper.parent) {
                            headPivotHelper.parent.remove(headPivotHelper);
                        }
                        // Bold axes (mesh-based) + marker for clear visibility
                        const axisGroup = new THREE.Group();
                        const axisDefs = [
                            { dir: new THREE.Vector3(1, 0, 0), color: 0xff4040 }, // X
                            { dir: new THREE.Vector3(0, 1, 0), color: 0x40ff40 }, // Y
                            { dir: new THREE.Vector3(0, 0, 1), color: 0x4080ff }  // Z
                        ];
                        for (const def of axisDefs) {
                            const dir = def.dir.clone().normalize();
                            const rot = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);

                            const shaft = new THREE.Mesh(
                                new THREE.CylinderGeometry(0.6, 0.6, 12, 8),
                                new THREE.MeshBasicMaterial({ color: def.color, depthTest: false })
                            );
                            shaft.position.copy(dir).multiplyScalar(6);
                            shaft.quaternion.copy(rot);
                            shaft.renderOrder = 5;
                            axisGroup.add(shaft);

                            const tip = new THREE.Mesh(
                                new THREE.ConeGeometry(1.4, 3.5, 8),
                                new THREE.MeshBasicMaterial({ color: def.color, depthTest: false })
                            );
                            tip.position.copy(dir).multiplyScalar(6 + 2.5);
                            tip.quaternion.copy(rot);
                            tip.renderOrder = 5;
                            axisGroup.add(tip);
                        }

                        const marker = new THREE.Mesh(
                            new THREE.SphereGeometry(1.8, 10, 10),
                            new THREE.MeshBasicMaterial({ color: 0xffff00, depthTest: false })
                        );
                        marker.renderOrder = 6;

                        headPivotHelper = new THREE.Group();
                        headPivotHelper.add(axisGroup);
                        headPivotHelper.add(marker);
                        headBone.add(headPivotHelper);
                    }

                    // Do not offset modelGroup by rootTranslation; bones already include it
                    const rootNodeTranslation = new THREE.Vector3(0, 0, 0);

                    let renderedCount = 0;
                    for (let i = 0; i < softSkinCount; i++) {
                        const softSkinMesh = softSkinMeshes.get(i);
                        if (!softSkinMesh) {
                            console.warn(`⚠️ Soft-skin mesh ${i} is null`);
                            continue;
                        }

                        const processed = model.convertSoftSkinMeshToProcessedMesh(softSkinMesh);

                        if (processed.indices.size() === 0 || processed.vertices.size() === 0) {
                            console.warn(`⚠️ Soft-skin mesh ${i} has no geometry`);
                            continue;
                        }

                        const { geometry, material, hasSkinning } = await buildSkinnedMeshGeometry(processed, skeleton);

                        // Calculate automatic geometry offset relative to reference model
                        // (Gothic CPU skinning vs Three.js GPU skinning difference)
                        const geometryOffset = referenceMesh 
                            ? model.calculateGeometryOffset(softSkinMesh, hierarchy, referenceMesh)
                            : model.calculateGeometryOffset(softSkinMesh, hierarchy, null);
                        
                        if (geometryOffset && Math.abs(geometryOffset.z) > 0.1) {
                            // Apply ONLY Z-axis offset (main difference between models)
                            // X and Y offsets can cause clipping issues
                            geometry.translate(0, 0, -geometryOffset.z);
                            console.log(`   🔧 Auto-applied Z-axis offset: ${(-geometryOffset.z).toFixed(2)} (original: X=${geometryOffset.x.toFixed(2)}, Y=${geometryOffset.y.toFixed(2)}, Z=${geometryOffset.z.toFixed(2)})`);
                        }

                        let meshObj;
                        if (hasSkinning && skeleton) {
                            meshObj = new THREE.SkinnedMesh(geometry, material);

                            // Add root bones to the mesh (or scene) to be part of the hierarchy
                            // We must add the ACTUAL root bones, not just bones[0]
                            for (const rootIdx of skeleton.rootNodes) {
                                if (modelGroup.children.indexOf(skeleton.bones[rootIdx]) === -1) {
                                    modelGroup.add(skeleton.bones[rootIdx]);
                                }
                            }

                            meshObj.bind(skeleton.threeSkeleton);
                            characterMesh = meshObj; // Store reference
                            console.log(`   ✅ Created skinned mesh for soft-skin mesh ${i}`);
                        } else {
                            meshObj = new THREE.Mesh(geometry, material);
                            console.log(`   ℹ️ Created static mesh for soft-skin mesh ${i} (skinning: ${hasSkinning})`);
                        }

                        modelGroup.add(meshObj);
                        renderedCount++;
                    }

                    // Rotate the model group to align Gothic Z-up with Three.js Y-up
                    // Removed rotation for debugging

                    console.log(`✅ Rendered ${renderedCount} soft-skin meshes`);

                    // Try to load head mesh if head bone exists
                    if (headNodeIndex >= 0) {
                        await tryLoadHeadMesh(modelGroup, hierarchy, headNodeIndex); // Pass modelGroup
                    }

                    if (modelGroup.children.length === 0) {
                        updateStatus('⚠️ No meshes rendered', 'loading');
                        return;
                    }

                    modelMesh = modelGroup;
                } else {
                    // Render attachments
                    const modelGroup = new THREE.Group();

                    function getAccumulatedTransform(nodeIndex) {
                        let currentIndex = nodeIndex;
                        let accumulatedMatrix = new THREE.Matrix4();

                        while (currentIndex >= 0) {
                            const node = hierarchy.nodes.get ? hierarchy.nodes.get(currentIndex) : hierarchy.nodes[currentIndex];
                            const nodeTransform = node.getTransform();
                            const nodeMatrix = new THREE.Matrix4();

                            const matrixData = nodeTransform.toArray();
                            for (let i = 0; i < 16; i++) {
                                nodeMatrix.elements[i] = matrixData[i];
                            }

                            const tempMatrix = new THREE.Matrix4();
                            tempMatrix.multiplyMatrices(nodeMatrix, accumulatedMatrix);
                            accumulatedMatrix = tempMatrix;

                            currentIndex = node.parentIndex;
                        }

                        return accumulatedMatrix;
                    }

                    for (let i = 0; i < attachmentNames.size(); i++) {
                        const attachmentName = attachmentNames.get(i);
                        const attachment = model.getAttachment(attachmentName);
                        if (!attachment) {
                            console.warn(`⚠️ Attachment ${attachmentName} not found in model`);
                            continue;
                        }

                        let hierarchyNodeIndex = -1;
                        const nodeCount = hierarchy.nodes.size ? hierarchy.nodes.size() : hierarchy.nodes.length;
                        for (let j = 0; j < nodeCount; j++) {
                            const node = hierarchy.nodes.get ? hierarchy.nodes.get(j) : hierarchy.nodes[j];
                            if (node && node.name === attachmentName) {
                                hierarchyNodeIndex = j;
                                break;
                            }
                        }

                        const processed = model.convertAttachmentToProcessedMesh(attachment);
                        if (processed.indices.size() === 0 || processed.vertices.size() === 0) {
                            console.warn(`⚠️ Attachment ${attachmentName} has no geometry`);
                            continue;
                        }

                        const { geometry, material } = await buildSkinnedMeshGeometry(processed, skeleton);
                        const attachmentMesh = new THREE.Mesh(geometry, material);

                        if (hierarchyNodeIndex >= 0) {
                            const accumulatedMatrix = getAccumulatedTransform(hierarchyNodeIndex);
                            attachmentMesh.applyMatrix4(accumulatedMatrix);
                            console.log(`   ✅ Applied transform from hierarchy node ${hierarchyNodeIndex}`);
                        } else {
                            console.warn(`   ⚠️ No hierarchy node found for ${attachmentName}, rendering at origin`);
                        }

                        modelGroup.add(attachmentMesh);
                    }

                    if (modelGroup.children.length === 0) {
                        updateStatus('⚠️ No attachments rendered', 'loading');
                        return;
                    }

                    console.log(`✅ Rendered ${modelGroup.children.length} attachments`);
                    modelMesh = modelGroup;
                }

                // Center the model
                const box = new THREE.Box3().setFromObject(modelMesh);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                console.log(`📐 Model bounds: center=(${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)}), size=(${size.x.toFixed(2)}, ${size.y.toFixed(2)}, ${size.z.toFixed(2)})`);

                modelMesh.position.sub(center);

                scene.add(modelMesh);
                if (skeleton) {
                    skeletonHelper = new THREE.SkeletonHelper(modelMesh);
                    skeletonHelper.material.color = new THREE.Color(0x00ff00);
                    skeletonHelper.material.linewidth = 2;
                    scene.add(skeletonHelper);

                    // Add labels to each bone for easier identification
                    skeleton.bones.forEach((bone, idx) => {
                        const label = createBoneLabel(`${idx}`);
                        label.position.set(0, 5, 0); // offset so text is readable
                        bone.add(label);
                        boneLabels.push(label);
                    });
                }

                // Adjust camera to view the model
                // User requested specific start position
                // camera.position.set(maxDim * 1.5, maxDim * 1.5, maxDim * 1.5);
                // camera.lookAt(0, 0, 0);

                console.log(`📷 Camera positioned at: (${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)})`);

                renderer.render(scene, camera);

            } catch (error) {
                updateStatus(`❌ Failed to render model: ${error.message}`, 'error');
                console.error('Model rendering error:', error);
            }
        }

        async function buildSkinnedMeshGeometry(processed, skeleton) {
            const idxCount = processed.indices.size();
            const matCount = processed.materials.size();

            // Build Three.js geometry
            const positions = new Float32Array(idxCount * 3);
            const normals = new Float32Array(idxCount * 3);
            const uvs = new Float32Array(idxCount * 2);

            // Skinning data
            const hasSkinning = processed.boneWeights && processed.boneWeights.size() > 0;
            const skinIndices = hasSkinning ? new Float32Array(idxCount * 4) : null;
            const skinWeights = hasSkinning ? new Float32Array(idxCount * 4) : null;

            for (let i = 0; i < idxCount; i++) {
                const vertIdx = processed.indices.get(i);
                const vertBase = vertIdx * 8;

                positions[i * 3 + 0] = processed.vertices.get(vertBase + 0);
                positions[i * 3 + 1] = processed.vertices.get(vertBase + 1);
                positions[i * 3 + 2] = processed.vertices.get(vertBase + 2);

                normals[i * 3 + 0] = processed.vertices.get(vertBase + 3);
                normals[i * 3 + 1] = processed.vertices.get(vertBase + 4);
                normals[i * 3 + 2] = processed.vertices.get(vertBase + 5);

                uvs[i * 2 + 0] = processed.vertices.get(vertBase + 6);
                uvs[i * 2 + 1] = processed.vertices.get(vertBase + 7);

                if (hasSkinning) {
                    const skinBase = vertIdx * 4;
                    skinIndices[i * 4 + 0] = processed.boneIndices.get(skinBase + 0);
                    skinIndices[i * 4 + 1] = processed.boneIndices.get(skinBase + 1);
                    skinIndices[i * 4 + 2] = processed.boneIndices.get(skinBase + 2);
                    skinIndices[i * 4 + 3] = processed.boneIndices.get(skinBase + 3);

                    skinWeights[i * 4 + 0] = processed.boneWeights.get(skinBase + 0);
                    skinWeights[i * 4 + 1] = processed.boneWeights.get(skinBase + 1);
                    skinWeights[i * 4 + 2] = processed.boneWeights.get(skinBase + 2);
                    skinWeights[i * 4 + 3] = processed.boneWeights.get(skinBase + 3);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
            geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

            if (hasSkinning) {
                geometry.setAttribute('skinIndex', new THREE.BufferAttribute(skinIndices, 4));
                geometry.setAttribute('skinWeight', new THREE.BufferAttribute(skinWeights, 4));
            }

            // Build material groups
            const triCount = processed.materialIds.size();
            geometry.clearGroups();

            let currentMatId = processed.materialIds.get(0);
            let groupStart = 0;

            for (let t = 1; t <= triCount; t++) {
                const matId = (t < triCount) ? processed.materialIds.get(t) : -1;

                if (t === triCount || matId !== currentMatId) {
                    const vertexStart = groupStart * 3;
                    const vertexCount = (t - groupStart) * 3;
                    geometry.addGroup(vertexStart, vertexCount, currentMatId);
                    groupStart = t;
                    currentMatId = matId;
                }
            }

            // Build material(s) - use standard Three.js materials with texture support
            let material;
            if (hasSkinning && skeleton) {
                // For skinned meshes, use MeshPhongMaterial with textures
                // Three.js will handle skinning automatically if we use SkinnedMesh
                // But since we're using custom shader, let's use basic material for now
                // Actually, let's use standard materials and let Three.js handle it

                // Create material array for each material group
                const materialArray = [];
                const matCount = processed.materials.size();
                console.log(`📦 Processing ${matCount} materials for skinned mesh`);

                for (let mi = 0; mi < matCount; mi++) {
                    const matData = processed.materials.get(mi);
                    const textureName = matData.texture || '';

                    const phongMaterial = new THREE.MeshPhongMaterial({
                        color: 0xFFFFFF,
                        side: THREE.DoubleSide,
                        transparent: false,
                        alphaTest: 0.5
                    });

                    // Load texture if available
                    if (textureName && textureName.length) {
                        const url = tgaNameToCompiledUrl(textureName);
                        console.log(`📦 Loading texture for material ${mi}: ${textureName} -> ${url}`);
                        const tex = await loadTextureCached(url);
                        if (tex) {
                            phongMaterial.map = tex;
                            phongMaterial.needsUpdate = true;
                            console.log(`✅ Loaded texture for material ${mi}: ${textureName} (${tex.width}x${tex.height})`);
                        } else {
                            console.warn(`⚠️ Failed to load texture: ${textureName} from ${url}`);
                        }
                    } else {
                        console.log(`ℹ️ Material ${mi} has no texture name`);
                    }

                    materialArray.push(phongMaterial);
                }

                // Use first material if array is empty, otherwise use array
                material = materialArray.length > 0 ? materialArray : new THREE.MeshPhongMaterial({
                    color: 0xCCCCCC,
                    side: THREE.DoubleSide
                });

                // Create standard material
                const materials = Array.isArray(material) ? material : [material];
                const standardMaterials = [];

                for (let mi = 0; mi < materials.length; mi++) {
                    const baseMat = materials[mi];
                    const texture = baseMat.map;

                    const stdMat = new THREE.MeshStandardMaterial({
                        map: texture,
                        side: THREE.DoubleSide,
                        roughness: 0.8,
                        metalness: 0.2
                    });
                    stdMat.skinning = true; // Enable skinning

                    standardMaterials.push(stdMat);
                }

                material = standardMaterials.length > 0 ? (standardMaterials.length === 1 ? standardMaterials[0] : standardMaterials) : standardMaterials[0];
            } else {
                // Static mesh - load texture
                if (processed.materials.size() > 0) {
                    material = await getMaterialCached(processed.materials.get(0));
                } else {
                    material = new THREE.MeshPhongMaterial({
                        color: 0xCCCCCC,
                        side: THREE.DoubleSide
                    });
                }
            }

            const applySkinFlag = (mat) => {
                if (!mat) return;
                if (hasSkinning) mat.skinning = true;
            };

            if (Array.isArray(material)) {
                material.forEach(applySkinFlag);
            } else {
                applySkinFlag(material);
            }

            return { geometry, material, hasSkinning };
        }


        async function loadAnimation(animationName, mdsAnimation = null, manBaseName = null) {
            try {
                const baseName = (manBaseName || currentMdsBaseName).toUpperCase();
                const cacheKey = `${baseName}:${animationName}`;
                if (animationCache.has(cacheKey)) {
                    return animationCache.get(cacheKey);
                }

                const manFileName = `${baseName}-${animationName}.MAN`.toUpperCase();
                const manPath = `/public/game-assets/ANIMS/_COMPILED/${manFileName}`;

                console.log(`🎬 Loading animation: ${manPath}`);
                const response = await fetch(manPath);
                if (!response.ok) {
                    console.warn(`Animation file ${manPath} not found`);
                    return null;
                }

                const buffer = await response.arrayBuffer();
                const data = new Uint8Array(buffer);

                const man = ZenKit.createModelAnimation();
                if (!man) {
                    throw new Error('Failed to create ModelAnimation instance');
                }
                const loadResult = man.loadFromArray(data);

                if (!loadResult.success) {
                    throw new Error(loadResult.errorMessage || man.getLastError() || 'Unknown loading error');
                }

                // Verify we can access node indices via getNodeIndex method
                const nodeCount = man.getNodeCount ? man.getNodeCount() : 0;
                if (nodeCount === 0) {
                    throw new Error('Animation has no nodes - invalid animation data');
                }

                const seq = new AnimationSequence(man, mdsAnimation);
                if (!animation) {
                    animation = new Animation();
                }
                animation.addSequence(animationName, seq);
                animationCache.set(cacheKey, seq);

                console.log(`✅ Loaded animation: ${animationName} (${seq.numFrames} frames, ${seq.nodeIndex.length} bones)`);
                return seq;
            } catch (e) {
                console.error(`Failed to load animation ${animationName}:`, e);
                return null;
            }
        }

        function playAnimation(animationName) {
            if (!pose || !animation) {
                console.warn('⚠️ No pose or animation system initialized');
                return;
            }

            const seq = animation.sequence(animationName);
            if (!seq) {
                console.warn(`⚠️ Animation ${animationName} not found`);
                return;
            }

            pose.startAnim(seq);
            console.log(`▶️ Playing animation: ${animationName}`);

            // Update UI
            document.querySelectorAll('.animation-item').forEach(item => {
                if (item.dataset.animationName === animationName) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        async function getMaterialCached(materialData) {
            const textureName = materialData.texture || '';

            if (materialCache.has(textureName)) {
                return materialCache.get(textureName);
            }

            const material = new THREE.MeshPhongMaterial({
                color: 0xFFFFFF,
                side: THREE.DoubleSide,
                transparent: false,
                alphaTest: 0.5
            });

            if (textureName && textureName.length) {
                const url = tgaNameToCompiledUrl(textureName);
                const tex = await loadTextureCached(url);
                if (tex) {
                    material.map = tex;
                    material.needsUpdate = true;
                }
            }

            materialCache.set(textureName, material);
            return material;
        }

        async function loadTextureCached(texturePath) {
            if (textureCache.has(texturePath)) {
                return textureCache.get(texturePath);
            }

            try {
                const tex = await loadCompiledTexAsDataTexture(texturePath);
                if (tex) {
                    textureCache.set(texturePath, tex);
                }
                return tex;
            } catch (error) {
                return null;
            }
        }

        async function loadCompiledTexAsDataTexture(url) {
            const res = await fetch(url);
            if (!res.ok) return null;
            const buf = await res.arrayBuffer();
            const arr = new Uint8Array(buf);
            const zkTex = new ZenKit.Texture();
            const ok = zkTex.loadFromArray(arr);
            if (!ok || !ok.success) return null;
            const w = zkTex.width;
            const h = zkTex.height;
            const rgba = zkTex.asRgba8(0);
            if (!rgba) return null;
            const tex = new THREE.DataTexture(rgba, w, h, THREE.RGBAFormat);
            tex.needsUpdate = true;
            tex.flipY = false;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.generateMipmaps = true;
            return tex;
        }

        function tgaNameToCompiledUrl(name) {
            if (!name || typeof name !== 'string') return null;
            let base = name.replace(/\.[^.]*$/, '').toUpperCase();
            
            // Override textures for female body (Hilda)
            // Hilda: face=144 (FACEBABE_N_WHITECLOTH), body=5 (BODYTEXBABE_N)
            if (FORCE_FEMALE_BODY) {
                if (base.includes('HUM_BODY')) {
                    base = 'HUM_BODY_NAKED_V5_C0';
                    console.log(`🎨 Using Hilda body texture: ${base}`);
                } else if (base.includes('HUM_HEAD')) {
                    base = 'HUM_HEAD_V144_C0';
                    console.log(`🎨 Using Hilda head texture: ${base}`);
                }
            }
            
            return `/public/game-assets/TEXTURES/_COMPILED/${base}-C.TEX`;
        }

        async function tryLoadHeadMesh(modelGroup, hierarchy, headNodeIndex) {
            try {
                if (headMeshesAvailable === false) {
                    console.log('ℹ️ Head MMB assets not available; skipping head load');
                    return;
                }
                // If we ever discover a missing asset, disable further attempts
                const markUnavailable = () => { headMeshesAvailable = false; };

                // Use user-selected head if available
                let headMeshNames;
                if (activeHeadName) {
                    headMeshNames = [activeHeadName];
                    console.log(`🎭 Loading user-selected head: ${activeHeadName}`);
                } else if (FORCE_FEMALE_BODY) {
                    // Hilda uses HUM_HEAD_BABE8
                    headMeshNames = [
                        'HUM_HEAD_BABE8',
                        'HUM_HEAD_BABE',
                        'HUM_HEAD_BABE1',
                        'HUM_HEAD_BABE2'
                    ];
                    console.log('🙋‍♀️ Loading female head (Hilda): HUM_HEAD_BABE8');
                } else {
                    // Male head
                    headMeshNames = [
                        'HUM_HEAD',
                        'HUM_HEAD_BABE',
                        'HUM_HEAD_BABE1',
                        'HUM_HEAD_BABE2'
                    ];
                }

                for (const headName of headMeshNames) {
                    const headMmbPath = `/public/game-assets/ANIMS/_COMPILED/${headName}.MMB`;

                    try {
                        const response = await fetch(headMmbPath);
                        if (!response.ok) {
                            markUnavailable();
                            continue;
                        }

                        updateStatus(`📦 Loading head mesh: ${headName}...`, 'loading');

                        const arrayBuffer = await response.arrayBuffer();
                        const uint8Array = new Uint8Array(arrayBuffer);

                        const morphMesh = ZenKit.createMorphMesh();
                        const loadResult = morphMesh.loadFromArray(uint8Array);

                        if (!loadResult || !loadResult.success) {
                            continue;
                        }

                        const processed = morphMesh.convertToProcessedMesh();
                        if (processed.indices.size() === 0 || processed.vertices.size() === 0) {
                            continue;
                        }

                        const { geometry, material } = await buildSkinnedMeshGeometry(processed, skeleton);
                        const headMesh = new THREE.Mesh(geometry, material);

                        // Attach head mesh directly to the head bone
                        if (skeleton && skeleton.bones && headNodeIndex >= 0 && headNodeIndex < skeleton.bones.length) {
                            const headBone = skeleton.bones[headNodeIndex];
                            headBone.add(headMesh);
                            console.log(`✅ Attached head mesh to bone: ${headBone.name}`);
                        } else {
                            console.warn(`⚠️ Could not find head bone to attach mesh`);
                            modelGroup.add(headMesh); // Fallback
                        }

                        headMeshesAvailable = true;
                        updateStatus(`✅ Head mesh loaded: ${headName}`, 'success');
                        return; // Successfully loaded head
                        console.log(`✅ Loaded and attached head mesh: ${headName}`);
                        updateStatus(`✅ Head mesh loaded: ${headName}`, 'success');
                        return; // Successfully loaded head
                    } catch (error) {
                        // Try next head mesh name
                        continue;
                    }
                }

                console.log(`⚠️ No head mesh found (tried: ${headMeshNames.join(', ')})`);
                markUnavailable();
            } catch (error) {
                console.warn(`⚠️ Failed to load head mesh: ${error.message}`);
                markUnavailable();
            }
        }

        function displayMdsInfo(mds, extraAnimations = [], extraDisabled = []) {
            // Show content
            document.getElementById('content').style.display = 'block';

            // Skeleton info
            document.getElementById('skeleton-name').textContent = mds.getSkeletonName() || '(none)';
            document.getElementById('skeleton-mesh-disabled').textContent = mds.isSkeletonMeshDisabled() ? 'Yes' : 'No';

            // Meshes
            const meshCount = mds.getMeshCount();
            const meshesList = document.getElementById('meshes-list');
            if (meshCount === 0) {
                meshesList.innerHTML = '<div class="info-item">No meshes defined</div>';
            } else {
                meshesList.innerHTML = '';
                for (let i = 0; i < meshCount; i++) {
                    const meshName = mds.getMeshName(i);
                    const item = document.createElement('div');
                    item.className = 'info-item clickable';
                    item.textContent = `${i + 1}. ${meshName}`;
                    
                    // Mark active mesh
                    if (activeMeshName === meshName || (!activeMeshName && i === 0)) {
                        item.classList.add('active');
                    }
                    
                    // Click handler to load specific mesh
                    item.addEventListener('click', async () => {
                        activeMeshName = meshName;
                        console.log(`🎯 Selected mesh: ${meshName}`);
                        // Reload the model with selected mesh
                        await loadMdsFile(DEFAULT_MDS, FORCE_FEMALE_BODY ? DEFAULT_OVERLAY : null);
                    });
                    
                    meshesList.appendChild(item);
                }
            }

            // Disabled animations
            const disabledCount = mds.getDisabledAnimationCount() + extraDisabled.length;
            const disabledList = document.getElementById('disabled-animations-list');
            if (disabledCount === 0) {
                disabledList.innerHTML = '<div class="info-item">No disabled animations</div>';
            } else {
                disabledList.innerHTML = '';
                for (let i = 0; i < mds.getDisabledAnimationCount(); i++) {
                    const animName = mds.getDisabledAnimationName(i);
                    const item = document.createElement('div');
                    item.className = 'info-item';
                    item.textContent = animName;
                    disabledList.appendChild(item);
                }
                for (const animName of extraDisabled) {
                    const item = document.createElement('div');
                    item.className = 'info-item';
                    item.textContent = `${animName} (overlay)`;
                    disabledList.appendChild(item);
                }
            }

            // Animations - make them clickable
            const baseAnimCount = mds.getAnimationCount();
            const animCount = baseAnimCount + extraAnimations.length;
            const animationsList = document.getElementById('animations-list');
            if (animCount === 0) {
                animationsList.innerHTML = '<div class="info-item">No animations defined</div>';
            } else {
                animationsList.innerHTML = '';
                for (let i = 0; i < baseAnimCount; i++) {
                    const animItem = document.createElement('div');
                    animItem.className = 'animation-item';

                    const name = mds.getAnimationName(i);
                    const layer = mds.getAnimationLayer(i);
                    const next = mds.getAnimationNext(i);
                    const blendIn = mds.getAnimationBlendIn(i);
                    const blendOut = mds.getAnimationBlendOut(i);
                    const flags = mds.getAnimationFlags(i);
                    const model = mds.getAnimationModel(i);
                    const firstFrame = mds.getAnimationFirstFrame(i);
                    const lastFrame = mds.getAnimationLastFrame(i);
                    const fps = mds.getAnimationFps(i);
                    const speed = mds.getAnimationSpeed(i);

                    // Calculate expected MAN filename for display
                    const manBase = currentMdsBaseName.toUpperCase();
                    const manName = `${manBase}-${name}.MAN`.toUpperCase();

                    animItem.innerHTML = `
                        <h3>🎬 ${name}</h3>
                        <div class="animation-details">
                            <div><span class="info-label">Layer:</span> <span class="info-value">${layer}</span></div>
                            <div><span class="info-label">Next:</span> <span class="info-value">${next || '(none)'}</span></div>
                            <div><span class="info-label">Blend In:</span> <span class="info-value">${blendIn.toFixed(2)}</span></div>
                            <div><span class="info-label">Blend Out:</span> <span class="info-value">${blendOut.toFixed(2)}</span></div>
                            <div><span class="info-label">Flags:</span> <span class="info-value">0x${flags.toString(16)}</span></div>
                            <div><span class="info-label">Source:</span> <span class="info-value">${model || '(none)'}</span></div>
                            <div><span class="info-label">Compiled:</span> <span class="info-value">${manName}</span></div>
                            <div><span class="info-label">Frames:</span> <span class="info-value">${firstFrame} - ${lastFrame}</span></div>
                            <div><span class="info-label">FPS:</span> <span class="info-value">${fps.toFixed(2)}</span></div>
                            <div><span class="info-label">Speed:</span> <span class="info-value">${speed.toFixed(2)}</span></div>
                        </div>
                        <div style="margin-top: 8px; font-size: 0.85em; color: #888;">
                            💡 Click to play animation
                        </div>
                    `;

                    // Store animation name as data attribute
                    animItem.dataset.animationName = name;
                    animItem.dataset.animationBase = manBase;

                    // Add click handler to play animation
                    animItem.addEventListener('click', async () => {
                        if (animItem.classList.contains('active')) {
                            // Stop animation by clearing current sequence
                            if (pose) {
                                pose.currentSeq = null;
                            }
                            animItem.classList.remove('active');
                        } else {
                            // Load and play animation
                            const mdsAnim = {
                                name: name,
                                flags: flags,
                                next: next
                            };
                            await loadAnimation(name, mdsAnim, manBase);
                            playAnimation(name);
                        }
                    });

                    animationsList.appendChild(animItem);
                }
                // Overlay / extra animations
                for (const extra of extraAnimations) {
                    const animItem = document.createElement('div');
                    animItem.className = 'animation-item';

                    const name = extra.name;
                    const layer = extra.layer;
                    const next = extra.next;
                    const blendIn = extra.blendIn;
                    const blendOut = extra.blendOut;
                    const flags = extra.flags;
                    const model = extra.model;
                    const firstFrame = extra.firstFrame;
                    const lastFrame = extra.lastFrame;
                    const fps = extra.fps;
                    const speed = extra.speed;
                    const manBase = extra.sourceBase || currentMdsBaseName.toUpperCase();
                    const manName = `${manBase}-${name}.MAN`.toUpperCase();

                    animItem.innerHTML = `
                        <h3>🎬 ${name} (overlay)</h3>
                        <div class="animation-details">
                            <div><span class="info-label">Layer:</span> <span class="info-value">${layer}</span></div>
                            <div><span class="info-label">Next:</span> <span class="info-value">${next || '(none)'}</span></div>
                            <div><span class="info-label">Blend In:</span> <span class="info-value">${blendIn.toFixed(2)}</span></div>
                            <div><span class="info-label">Blend Out:</span> <span class="info-value">${blendOut.toFixed(2)}</span></div>
                            <div><span class="info-label">Flags:</span> <span class="info-value">0x${flags.toString(16)}</span></div>
                            <div><span class="info-label">Source:</span> <span class="info-value">${model || '(none)'}</span></div>
                            <div><span class="info-label">Compiled:</span> <span class="info-value">${manName}</span></div>
                            <div><span class="info-label">Frames:</span> <span class="info-value">${firstFrame} - ${lastFrame}</span></div>
                            <div><span class="info-label">FPS:</span> <span class="info-value">${fps.toFixed(2)}</span></div>
                            <div><span class="info-label">Speed:</span> <span class="info-value">${speed.toFixed(2)}</span></div>
                        </div>
                        <div style="margin-top: 8px; font-size: 0.85em; color: #888;">
                            💡 Click to play animation (overlay)
                        </div>
                    `;

                    animItem.dataset.animationName = name;
                    animItem.dataset.animationBase = manBase;

                    animItem.addEventListener('click', async () => {
                        if (animItem.classList.contains('active')) {
                            // Stop animation by clearing current sequence
                            if (pose) {
                                pose.currentSeq = null;
                            }
                            animItem.classList.remove('active');
                        } else {
                            const mdsAnim = {
                                name: name,
                                flags: flags,
                                next: next
                            };
                            await loadAnimation(name, mdsAnim, manBase);
                            playAnimation(name);
                        }
                    });

                    animationsList.appendChild(animItem);
                }
            }

            console.log(`✅ Displayed MDS information:`);
            console.log(`   - Skeleton: ${mds.getSkeletonName()}`);
            console.log(`   - Meshes: ${meshCount}`);
            console.log(`   - Disabled animations: ${disabledCount}`);
            console.log(`   - Animations: ${animCount}`);

            // Auto-load first animation if available (async, don't await here)
            if (animCount > 0 && pose && animation) {
                const firstAnimName = mds.getAnimationName(0);
                const mdsAnim = {
                    name: firstAnimName,
                    flags: mds.getAnimationFlags(0),
                    next: mds.getAnimationNext(0)
                };
                loadAnimation(firstAnimName, mdsAnim, currentMdsBaseName.toUpperCase()).then(seq => {
                    if (seq) {
                        pose.startAnim(seq);
                        console.log(`Auto-started animation: ${firstAnimName}`);

                        // Note: Three.js SkinnedMesh handles bone matrices automatically
                        // No manual matrix update needed
                    }
                });
            }
        }

        // Initialize on page load
        initZenKit();
    </script>
