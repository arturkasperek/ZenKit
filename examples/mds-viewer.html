<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenKit MDS Viewer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .viewer-container {
            flex: 1;
            position: relative;
            background: #111;
        }

        #threejs-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .info-panel {
            width: 400px;
            background: #2a2a2a;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
        }

        .status {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #4a9eff;
        }

        .info-section {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .info-section h2 {
            margin-top: 0;
            color: #4a9eff;
            font-size: 1.2em;
        }

        .info-item {
            margin: 10px 0;
            padding: 8px;
            background: #1a1a1a;
            border-radius: 3px;
        }

        .info-label {
            font-weight: bold;
            color: #aaa;
        }

        .info-value {
            color: #fff;
            margin-left: 10px;
        }

        .animation-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .animation-item {
            background: #1a1a1a;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            border-left: 3px solid #4a9eff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .animation-item:hover {
            background: #252525;
        }

        .animation-item.active {
            background: #1a3a4a;
            border-left-color: #6ac5ff;
        }

        .animation-item h3 {
            margin: 0 0 8px 0;
            color: #4a9eff;
            font-size: 1em;
        }

        .animation-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 5px;
            font-size: 0.9em;
        }

        .error {
            background: #4a1a1a;
            border-left-color: #ff4a4a;
            color: #ffaaaa;
        }

        .success {
            background: #1a4a1a;
            border-left-color: #4aff4a;
            color: #aaffaa;
        }

        .controls-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 6px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
        }

        canvas:focus {
            outline: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="viewer-container">
            <canvas id="threejs-canvas"></canvas>

            <div id="status" class="controls-info">
                <div><strong>Loading Status:</strong></div>
                <div>Initializing ZenKit...</div>
            </div>

            <div class="controls-info" style="top: 120px;">
                <div><strong>Camera Controls:</strong></div>
                <div>Mouse: Click & drag to look around</div>
                <div>WASD / Arrows: Move</div>
                <div>Q/Space: Up | Z/Shift: Down</div>
                <div>Mouse wheel: Speed</div>
            </div>
        </div>

        <div class="info-panel">
            <h1>ZenKit MDS Viewer</h1>

            <div id="content" style="display: none;">
                <div class="info-section">
                    <h2>Skeleton Information</h2>
                    <div class="info-item">
                        <span class="info-label">Name:</span>
                        <span class="info-value" id="skeleton-name">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Mesh Disabled:</span>
                        <span class="info-value" id="skeleton-mesh-disabled">-</span>
                    </div>
                </div>

                <div class="info-section">
                    <h2>Meshes</h2>
                    <div id="meshes-list"></div>
                </div>

                <div class="info-section">
                    <h2>Disabled Animations</h2>
                    <div id="disabled-animations-list"></div>
                </div>

                <div class="info-section">
                    <h2>Animations</h2>
                    <div class="animation-list" id="animations-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import Three.js from CDN
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.min.js';

        let ZenKit = null;
        let scene, camera, renderer;
        let modelMesh = null;
        let characterMesh = null; // The skinned mesh
        let skeleton = null; // Custom Skeleton class instance
        let animation = null; // Custom Animation class instance
        let pose = null; // Custom Pose class instance
        let currentMdsBaseName = 'HumanS'; // Store the MDS base name
        let headBoneObject = null; // Object3D that follows the head bone for attaching the head mesh
        let headNodeIndex = -1; // Index of the head bone in the skeleton
        let skeletonHelper = null; // Visualize bones
        let boneLabels = []; // Sprites with bone ids
        const rootYawOffsetDeg = -90; // Always neutralize root yaw with this offset
        const rootXOffsetDeg = -90; // Always apply this X (pitch) offset

        // Asset caches
        const meshCache = new Map();
        const textureCache = new Map();
        const materialCache = new Map();
        const modelCache = new Map();
        const animationCache = new Map();

        // Camera control variables
        let moveSpeed = 10;
        let mouseSensitivity = 0.002;
        let pitch = 0, yaw = 0;
        let velocity = new THREE.Vector3();
        let isMouseDown = false;
        let lastMouseX = 0, lastMouseY = 0;

        // ====================================================================
        // ANIMATION MATH UTILITIES (Port of OpenGothic's animmath.cpp)
        // ====================================================================

        function mix(x, y, a) {
            return x + (y - x) * a;
        }

        /**
         * Quaternion spherical linear interpolation
         * Port of OpenGothic's slerp function
         */
        function slerp(q1, q2, t) {
            let z = { x: q2.x, y: q2.y, z: q2.z, w: q2.w };
            let cosTheta = q1.x * q2.x + q1.y * q2.y + q1.z * q2.z + q1.w * q2.w;

            if (cosTheta < 0.0) {
                z.x = -q2.x; z.y = -q2.y; z.z = -q2.z; z.w = -q2.w;
                cosTheta = -cosTheta;
            }

            if (cosTheta > 1.0 - Number.EPSILON) {
                return {
                    w: mix(q1.w, z.w, t),
                    x: mix(q1.x, z.x, t),
                    y: mix(q1.y, z.y, t),
                    z: mix(q1.z, z.z, t)
                };
            }

            const angle = Math.acos(cosTheta);
            const kx = Math.sin((1.0 - t) * angle);
            const kz = Math.sin(t * angle);
            const div = Math.sin(angle);

            return {
                w: (q1.w * kx + z.w * kz) / div,
                x: (q1.x * kx + z.x * kz) / div,
                y: (q1.y * kx + z.y * kz) / div,
                z: (q1.z * kx + z.z * kz) / div
            };
        }

        /**
         * Interpolate AnimationSample (position + rotation)
         * Port of OpenGothic's mix function
         */
        function mixSample(sample1, sample2, t) {
            return {
                rotation: slerp(sample1.rotation, sample2.rotation, t),
                position: {
                    x: mix(sample1.position.x, sample2.position.x, t),
                    y: mix(sample1.position.y, sample2.position.y, t),
                    z: mix(sample1.position.z, sample2.position.z, t)
                }
            };
        }

        /**
         * Convert AnimationSample to THREE.Matrix4
         * Port of OpenGothic's mkMatrix function
         */
        function mkMatrix(sample) {
            const q = sample.rotation;
            const p = sample.position;
            const m = new THREE.Matrix4();
            const te = m.elements;

            const x = q.x, y = q.y, z = q.z, w = q.w;
            const x2 = x + x, y2 = y + y, z2 = z + z;
            const xx = x * x2, xy = x * y2, xz = x * z2;
            const yy = y * y2, yz = y * z2, zz = z * z2;
            const wx = w * x2, wy = w * y2, wz = w * z2;

            te[0] = 1 - (yy + zz);
            te[1] = xy + wz;
            te[2] = xz - wy;
            te[3] = 0;
            te[4] = xy - wz;
            te[5] = 1 - (xx + zz);
            te[6] = yz + wx;
            te[7] = 0;
            te[8] = xz + wy;
            te[9] = yz - wx;
            te[10] = 1 - (xx + yy);
            te[11] = 0;
            te[12] = p.x;
            te[13] = p.y;
            te[14] = p.z;
            te[15] = 1;

            return m;
        }

        const radToDeg = (rad) => Number((rad * 180 / Math.PI).toFixed(3));
        const quatToEulerDegYXZ = (quat) => {
            const e = new THREE.Euler().setFromQuaternion(
                new THREE.Quaternion(quat.x, quat.y, quat.z, quat.w),
                'YXZ'
            );
            return { y: radToDeg(e.y), x: radToDeg(e.x), z: radToDeg(e.z) };
        };

        function logPoseDebug(tag, pose) {
            if (!pose || !pose.skeleton || !pose.skeleton.bones || pose.skeleton.bones.length === 0) {
                return;
            }

            const rootIdx = pose.skeleton.rootNodes && pose.skeleton.rootNodes.length > 0
                ? pose.skeleton.rootNodes[0]
                : 0;
            const rootBone = pose.skeleton.bones[rootIdx];
            const rootEuler = new THREE.Euler().setFromQuaternion(rootBone.quaternion, 'YXZ');

            const modelEuler = characterMesh
                ? new THREE.Euler().setFromQuaternion(characterMesh.quaternion, 'YXZ')
                : null;

            const snapshot = {
                tag,
                anim: pose.currentSeq ? pose.currentSeq.name : null,
                animClass: pose.currentSeq ? pose.currentSeq.animCls : null,
                timeMs: Number(pose.animTime.toFixed(3)),
                frameInfo: pose.lastFrameInfo || null,
                skeletonRootTranslation: pose.skeleton.rootTr,
                rootBone: {
                    index: rootIdx,
                    name: rootBone ? rootBone.name : '(unknown)',
                    position: rootBone ? {
                        x: Number(rootBone.position.x.toFixed(3)),
                        y: Number(rootBone.position.y.toFixed(3)),
                        z: Number(rootBone.position.z.toFixed(3))
                    } : null,
                    rotationQuat: rootBone ? {
                        x: Number(rootBone.quaternion.x.toFixed(6)),
                        y: Number(rootBone.quaternion.y.toFixed(6)),
                        z: Number(rootBone.quaternion.z.toFixed(6)),
                        w: Number(rootBone.quaternion.w.toFixed(6))
                    } : null,
                    rotationDegYXZ: rootBone ? {
                        y: radToDeg(rootEuler.y),
                        x: radToDeg(rootEuler.x),
                        z: radToDeg(rootEuler.z)
                    } : null
                },
                model: characterMesh ? {
                    position: {
                        x: Number(characterMesh.position.x.toFixed(3)),
                        y: Number(characterMesh.position.y.toFixed(3)),
                        z: Number(characterMesh.position.z.toFixed(3))
                    },
                    rotationDegYXZ: {
                        y: radToDeg(modelEuler.y),
                        x: radToDeg(modelEuler.x),
                        z: radToDeg(modelEuler.z)
                    },
                    scale: {
                        x: Number(characterMesh.scale.x.toFixed(3)),
                        y: Number(characterMesh.scale.y.toFixed(3)),
                        z: Number(characterMesh.scale.z.toFixed(3))
                    }
                } : null
            };

            console.log(`[PoseDebug] ${JSON.stringify(snapshot)}`);
        }

        function logRootSamples(sequence, pose) {
            if (!sequence || !pose || !pose.skeleton || !pose.skeleton.rootNodes || pose.skeleton.rootNodes.length === 0) {
                return;
            }

            const rootIdx = pose.skeleton.rootNodes[0];
            const nodeIdxPos = sequence.nodeIndex.indexOf(rootIdx);
            if (nodeIdxPos < 0) return; // root not animated in this sequence

            const samples = [];
            for (const frame of [0, 1]) {
                if (frame >= sequence.numFrames) continue;
                const sample = sequence.samples[frame * sequence.nodeIndex.length + nodeIdxPos];
                if (!sample) continue;
                samples.push({
                    frame,
                    position: {
                        x: Number(sample.position.x.toFixed(3)),
                        y: Number(sample.position.y.toFixed(3)),
                        z: Number(sample.position.z.toFixed(3))
                    },
                    rotationQuat: {
                        x: Number(sample.rotation.x.toFixed(6)),
                        y: Number(sample.rotation.y.toFixed(6)),
                        z: Number(sample.rotation.z.toFixed(6)),
                        w: Number(sample.rotation.w.toFixed(6))
                    },
                    rotationDegYXZ: quatToEulerDegYXZ(sample.rotation)
                });
            }

            if (samples.length) {
                const payload = {
                    tag: 'root-samples',
                    anim: sequence.name || '(unnamed)',
                    numFrames: sequence.numFrames,
                    fps: sequence.fpsRate,
                    rootNodeIndex: rootIdx,
                    samples
                };
                console.log(`[PoseDebug] ${JSON.stringify(payload)}`);
            }
        }

        // ====================================================================
        // SKELETON CLASS (Port of OpenGothic's Skeleton)
        // ====================================================================

        class Skeleton {
            constructor(hierarchy) {
                this.nodes = [];
                this.rootNodes = [];
                this.bones = []; // Array of THREE.Bone
                this.rootTr = { x: 0, y: 0, z: 0 };
                this.bindRotEuler = [];

                const nodeCount = hierarchy.nodes.size();

                // 1. Create Bones
                for (let i = 0; i < nodeCount; i++) {
                    const node = hierarchy.nodes.get(i);
                    const parentIdx = node.parentIndex;

                    const bone = new THREE.Bone();
                    bone.name = node.name;
                    this.bones.push(bone);

                    this.nodes.push({
                        parent: parentIdx === -1 ? -1 : parentIdx,
                        transform: node.getTransform(), // Bind pose transform
                        name: node.name
                    });
                }

                // 2. Build Hierarchy
                for (let i = 0; i < this.nodes.length; i++) {
                    const parentIdx = this.nodes[i].parent;
                    if (parentIdx === -1) {
                        this.rootNodes.push(i);
                    } else {
                        this.bones[parentIdx].add(this.bones[i]);
                    }
                }

                // 3. Set Initial Bind Pose (Local Transforms)
                // The transform from ZenKit is the bind pose matrix (relative to parent?)
                // ZenKit's node.transform is the local transform relative to parent.
                for (let i = 0; i < this.nodes.length; i++) {
                    const node = this.nodes[i];
                    const bone = this.bones[i];

                    const mat = this.matrix4x4DataToMatrix4(node.transform);

                    // Decompose matrix to pos/quat/scale
                    const pos = new THREE.Vector3();
                    const quat = new THREE.Quaternion();
                    const scale = new THREE.Vector3();
                    mat.decompose(pos, quat, scale);

                    bone.position.copy(pos);
                    bone.quaternion.copy(quat);
                    bone.scale.copy(scale);

                    const e = new THREE.Euler().setFromQuaternion(quat, 'YXZ');
                    this.bindRotEuler.push({ x: e.x, y: e.y, z: e.z });
                }

                // 4. Apply Root Translation to Root Bones
                // 4. Apply Root Translation to Root Bones (matches OpenGothic)
                const rt = hierarchy.rootTranslation;
                this.rootTr = { x: rt.x, y: rt.y, z: rt.z };

                for (const rootIdx of this.rootNodes) {
                    const bone = this.bones[rootIdx];
                    bone.position.x += this.rootTr.x;
                    bone.position.y += this.rootTr.y;
                    bone.position.z += this.rootTr.z;
                }

                // 5. Compute bind-pose inverses
                for (const rootIdx of this.rootNodes) {
                    this.bones[rootIdx].updateMatrixWorld(true);
                }
                const boneInverses = [];
                for (let i = 0; i < this.bones.length; i++) {
                    const inv = new THREE.Matrix4();
                    inv.copy(this.bones[i].matrixWorld).invert();
                    boneInverses.push(inv);
                }

                this.threeSkeleton = new THREE.Skeleton(this.bones, boneInverses);
            }

            matrix4x4DataToMatrix4(mat4Data) {
                const m = new THREE.Matrix4();
                const te = m.elements;
                for (let i = 0; i < 16; i++) {
                    te[i] = mat4Data.get(i);
                }
                return m;
            }

            findNode(name) {
                for (let i = 0; i < this.nodes.length; i++) {
                    if (this.nodes[i].name === name) {
                        return i;
                    }
                }
                return -1;
            }
        }

        // ====================================================================
        // ANIMATION CLASSES (Port of OpenGothic's Animation)
        // ====================================================================

        class AnimationSequence {
            constructor(manData, mdsAnimation) {
                this.name = manData.name;
                this.samples = [];
                this.nodeIndex = [];
                this.numFrames = manData.getFrameCount ? manData.getFrameCount() : 0;
                this.fpsRate = manData.getFps ? manData.getFps() : 25.0;
                this.animCls = 'Transition';
                this.flags = mdsAnimation ? mdsAnimation.flags : 0;

                // Copy node indices using getNodeIndex method
                const nodeIdxCount = manData.getNodeCount ? manData.getNodeCount() : 0;
                for (let i = 0; i < nodeIdxCount; i++) {
                    this.nodeIndex.push(manData.getNodeIndex(i));
                }

                // Copy samples using getSample(frameIndex, nodeIndex) method
                // Samples are stored as: frameIndex * nodeCount + nodeIndex
                for (let frameIdx = 0; frameIdx < this.numFrames; frameIdx++) {
                    for (let nodeIdx = 0; nodeIdx < nodeIdxCount; nodeIdx++) {
                        const sample = manData.getSample(frameIdx, nodeIdx);
                        if (sample && sample.position && sample.rotation) {
                            this.samples.push({
                                position: { x: sample.position.x, y: sample.position.y, z: sample.position.z },
                                rotation: { x: sample.rotation.x, y: sample.rotation.y, z: sample.rotation.z, w: sample.rotation.w }
                            });
                        } else {
                            // Fallback: create default sample
                            this.samples.push({
                                position: { x: 0, y: 0, z: 0 },
                                rotation: { x: 0, y: 0, z: 0, w: 1 }
                            });
                        }
                    }
                }

                if (mdsAnimation && mdsAnimation.next === mdsAnimation.name) {
                    this.animCls = 'Loop';
                }
            }

            totalTime() {
                return (this.numFrames * 1000.0) / this.fpsRate;
            }
        }

        class Animation {
            constructor() {
                this.sequences = new Map();
            }

            addSequence(name, sequence) {
                this.sequences.set(name.toUpperCase(), sequence);
            }

            sequence(name) {
                return this.sequences.get(name.toUpperCase());
            }
        }

        // ====================================================================
        // POSE CLASS (Port of OpenGothic's Pose)
        // ====================================================================

        class Pose {
            constructor(skeleton) {
                this.skeleton = skeleton;
                this.base = [];
                this.currentSeq = null;
                this.animTime = 0;
                this.numBones = skeleton.nodes.length;
                this.lastFrameInfo = null;
                this.debugLogCounter = 0;
                this.debugJustStarted = false;

                for (let i = 0; i < this.numBones; i++) {
                    this.base.push(null);
                }

                // Initial application (will leave bones in bind pose as base is all null)
                this.applyToSkeleton();
            }

            startAnim(sequence) {
                this.currentSeq = sequence;
                this.animTime = 0;
                this.lastFrameInfo = null;
                this.debugLogCounter = 3; // log a few frames to capture jumps
                this.debugJustStarted = true;
                console.log(`Started animation: ${sequence.name || '(unnamed)'}, ${sequence.numFrames} frames at ${sequence.fpsRate} FPS`);
                logRootSamples(sequence, this);
                logPoseDebug('start', this);
            }

            update(deltaTime) {
                if (!this.currentSeq) return false;

                this.animTime += deltaTime;

                const totalTime = this.currentSeq.totalTime();
                if (this.currentSeq.animCls === 'Loop' && this.animTime >= totalTime) {
                    this.animTime = this.animTime % totalTime;
                }

                const updated = this.updateFrame(this.currentSeq, this.animTime);
                if (updated) {
                    this.applyToSkeleton();
                    if (this.debugLogCounter > 0) {
                        logPoseDebug(this.debugJustStarted ? 'first-frame' : 'debug', this);
                        this.debugLogCounter -= 1;
                        this.debugJustStarted = false;
                    }
                }
                return updated;
            }

            updateFrame(sequence, now) {
                const numFrames = sequence.numFrames;
                const idSize = sequence.nodeIndex.length;
                if (numFrames === 0 || idSize === 0 || sequence.samples.length === 0) {
                    return false;
                }

                const fpsRate = sequence.fpsRate;
                const frame = (now * fpsRate) / 1000.0;
                let frameA = Math.floor(frame);
                let frameB = frameA + 1;
                const a = frame - frameA;

                if (sequence.animCls === 'Loop') {
                    frameA = frameA % numFrames;
                    frameB = frameB % numFrames;
                } else {
                    frameA = Math.min(frameA, numFrames - 1);
                    frameB = Math.min(frameB, numFrames - 1);
                }

                const sampleA = frameA * idSize;
                const sampleB = frameB * idSize;

                this.lastFrameInfo = {
                    frame: Number(frame.toFixed(3)),
                    frameA,
                    frameB,
                    interp: Number(a.toFixed(3)),
                    fps: fpsRate,
                    numFrames,
                    nodes: idSize
                };

                for (let i = 0; i < idSize; i++) {
                    const idx = sequence.nodeIndex[i];
                    if (idx >= this.numBones) continue;

                    const sampA = sequence.samples[sampleA + i];
                    const sampB = sequence.samples[sampleB + i];
                    this.base[idx] = mixSample(sampA, sampB, a);
                }

                return true;
            }

            applyToSkeleton() {
                if (!this.skeleton || !this.skeleton.bones) return;

                const rootIdx = this.skeleton.rootNodes && this.skeleton.rootNodes.length > 0
                    ? this.skeleton.rootNodes[0]
                    : -1;

                for (let i = 0; i < this.skeleton.bones.length; i++) {
                    const bone = this.skeleton.bones[i];
                    const sample = this.base[i];

                    if (sample) {
                        let rot = sample.rotation;
                        if (i === rootIdx && this.skeleton.bindRotEuler && this.skeleton.bindRotEuler[i]) {
                            // Keep bind yaw plus fixed offset, preserve animated roll, allow X offset debug
                            const e = new THREE.Euler().setFromQuaternion(
                                new THREE.Quaternion(rot.x, rot.y, rot.z, rot.w),
                                'YXZ'
                            );
                            const bind = this.skeleton.bindRotEuler[i];
                            const yawOffset = THREE.MathUtils.degToRad(rootYawOffsetDeg);
                            const xOffset = THREE.MathUtils.degToRad(rootXOffsetDeg);
                            e.x = bind.x + xOffset;
                            e.y = bind.y + yawOffset;
                            e.z = bind.z;
                            const q = new THREE.Quaternion().setFromEuler(e);
                            rot = { x: q.x, y: q.y, z: q.z, w: q.w };
                        }

                        // Apply interpolated sample
                        bone.position.set(sample.position.x, sample.position.y, sample.position.z);
                        bone.quaternion.set(rot.x, rot.y, rot.z, rot.w);
                        // Scale is usually not animated in Gothic, but if we had it, we'd apply it here
                        bone.scale.set(1, 1, 1);
                    } else {
                        // Not animated in this sequence - leave as is (bind pose or previous state)
                        // Ideally we should reset to bind pose if we want strict behavior, 
                        // but Gothic animations often layer or rely on previous state.
                        // For now, doing nothing preserves the bind pose if never animated.
                    }
                }
            }
        }

        function updateStatus(message, type = 'loading') {
            console.log(message);
            const statusEl = document.getElementById('status');

            camera.position.set(94.09, 94.09, 94.09);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                logarithmicDepthBuffer: true
            });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(100, 100, 50);

            // Handle resize

        function setupControls() {
            const canvas = renderer.domElement;
            const keys = {};

            // Initialize camera orientation
            const initialDirection = new THREE.Vector3(0, 0, -1);
            initialDirection.applyQuaternion(camera.quaternion);
            yaw = Math.atan2(initialDirection.x, initialDirection.z);
            pitch = Math.asin(initialDirection.y);

            // Mouse controls for camera rotation
            canvas.addEventListener('mousedown', (event) => {
                isMouseDown = true;
                lastMouseX = event.clientX;
                lastMouseY = event.clientY;
                canvas.requestPointerLock();
            });

            document.addEventListener('mousemove', (event) => {
                if (!isMouseDown || document.pointerLockElement !== canvas) return;

                const deltaX = event.movementX || 0;
                const deltaY = event.movementY || 0;

                yaw -= deltaX * mouseSensitivity;
                pitch -= deltaY * mouseSensitivity;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

                updateCameraOrientation();
            });

            canvas.addEventListener('mouseup', () => {
                isMouseDown = false;
                document.exitPointerLock();
                console.log(`📷 Camera: pos(${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)}) rot(${camera.rotation.x.toFixed(2)}, ${camera.rotation.y.toFixed(2)}, ${camera.rotation.z.toFixed(2)})`);
            });

            // Keyboard controls for movement
            document.addEventListener('keydown', (event) => {
                keys[event.code] = true;
            });

            document.addEventListener('keyup', (event) => {
                keys[event.code] = false;
                console.log(`📷 Camera: pos(${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)}) rot(${camera.rotation.x.toFixed(2)}, ${camera.rotation.y.toFixed(2)}, ${camera.rotation.z.toFixed(2)})`);
            });

            // Mouse wheel for movement speed
            canvas.addEventListener('wheel', (event) => {
                moveSpeed += event.deltaY * 0.1;
                moveSpeed = Math.max(1, Math.min(500, moveSpeed));
                event.preventDefault();
            });

            function updateCameraOrientation() {
                const quaternion = new THREE.Quaternion();
                quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                camera.quaternion.copy(quaternion);
            }

            function updateMovement() {
                velocity.set(0, 0, 0);

                const forward = new THREE.Vector3(0, 0, -1);
                const right = new THREE.Vector3(1, 0, 0);
                const up = new THREE.Vector3(0, 1, 0);

                forward.applyQuaternion(camera.quaternion);
                right.applyQuaternion(camera.quaternion);

                if (keys['KeyW'] || keys['ArrowUp']) {
                    velocity.add(forward);
                }
                if (keys['KeyS'] || keys['ArrowDown']) {
                    velocity.sub(forward);
                }
                if (keys['KeyA'] || keys['ArrowLeft']) {
                    velocity.sub(right);
                }
                if (keys['KeyD'] || keys['ArrowRight']) {
                    velocity.add(right);
                }
                if (keys['KeyQ'] || keys['Space']) {
                    velocity.add(up);
                }
                if (keys['KeyZ'] || keys['ShiftLeft']) {
                    velocity.sub(up);
                }

                if (velocity.length() > 0) {
                    velocity.normalize().multiplyScalar(moveSpeed);
                    camera.position.add(velocity);
                }
            }

            // Animation loop for smooth movement
            let lastTime = performance.now();
            function animate() {
                const now = performance.now();
                const deltaTime = now - lastTime;
                lastTime = now;

                updateMovement();

                // Update pose animation
                if (pose) {
                    const updated = pose.update(deltaTime);
                    // No need to manually update uniforms, Three.js SkinnedMesh handles it
                }
                if (skeletonHelper && typeof skeletonHelper.update === 'function') {
                    skeletonHelper.update();
                }

                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            animate();
        }

            const canvas = document.getElementById('threejs-canvas');
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();

        }
